entities:[
 "Týdenní noční pochůzky s doprovodem a rozdáváním sendvičů lidem bez domova. Pořádá noční sčítání lidí bez domova 17. listopadu 2026 spolu s Fundación Ibercaja.",
 "Programy sociální péče: 4 678 příjemců pomoci a 148 dobrovolníků v roce 2024 podle Fundación Lealtad.",
 "Iniciativa sociálního dobrovolnictví ve Valencii uvedená v dokumentu jako cesta, jak mohou mladí lidé jednat proti bezdomovectví.",
 "Sociální organizace ve Valencii uvedená v dokumentu jako možnost dobrovolnictví mládeže a sociální pomoci.",
 "Program Červeného kříže ve Valencii uvedený v dokumentu jako možnost sociálního dobrovolnictví.",
 "Organizace usilující o to, aby nikdo nemusel žít na ulici, uvedená v dokumentu jako možnost dobrovolnictví.",
 "Projekty pro děti a podpora rodin v obtížné situaci."
],
q:[
 {tag:"Chudoba a vyloučení · Míra AROPE",q:"Jaké procento obyvatel Španělska je ohroženo chudobou nebo sociálním vyloučením (míra AROPE) podle posledních konečných údajů INE (španělského statistického úřadu)?",o:["11,4 %","18,2 %","25,7 %","38,5 %"],key:"25,7 %",
  r:"25,7 % obyvatel Španělska (asi 12,6 milionu lidí) bylo v roce 2025 ohroženo chudobou nebo sociálním vyloučením podle Šetření životních podmínek INE (zveřejněno v únoru 2026 s příjmy za rok 2024) a 16. zprávy EAPN. Ukazatel spojuje tři rozměry: 19,5 % žije pod hranicí příjmové chudoby (méně než 12 220 € ročně na spotřební jednotku, asi 1 018 €/měsíc), 8,1 % trpí závažnou materiální a sociální deprivací (téměř čtyři miliony lidí) a 8,0 % žije v domácnostech s nízkou pracovní intenzitou.",
  s:"INE (Šetření životních podmínek 2025, zveř. únor 2026) a 16. zpráva EAPN (2026)",e:"Pokud je v této situaci každý čtvrtý člověk, jaké každodenní věci podle vás tyto rodiny přestávají dělat, aniž by to bylo zvenku vidět?"},
 {tag:"Finanční zranitelnost · Nečekané výdaje",q:"Jaké procento obyvatel Španělska NEBYLO v roce 2025 schopno uhradit nečekané výdaje?",o:["14,5 %","22,0 %","36,4 %","54,1 %"],key:"36,4 %",
  r:"Podle Šetření životních podmínek INE 2025 (zveřejněno v únoru 2026) nemohlo 36,4 % obyvatel uhradit nečekané výdaje (oproti 35,8 % v roce 2024). Podle EAPN (2026) navíc 46,0 % vychází s penězi s určitými obtížemi, 8,5 % s „velkými obtížemi“ (v Kastilii-La Manche až 12,7 %, v Murcii 12,1 % a na Kanárských ostrovech 11,5 %) a 32,2 % si nemůže dovolit ani týden dovolené mimo domov ročně.",
  s:"INE (Šetření životních podmínek 2025, zveř. únor 2026) a 16. zpráva EAPN (2026)",e:"Představte si, že se rozbije pračka nebo je potřeba jít k zubaři: jak by se cítil někdo, kdo ví, že to nemůže zaplatit?"},
 {tag:"Energetická chudoba",q:"Jaké procento obyvatel Španělska nedokázalo v roce 2025 udržet v bytě přiměřenou teplotu?",o:["5,2 %","15,9 %","28,4 %","41,0 %"],key:"15,9 %",
  r:"Přestože se situace zlepšila oproti 20,7 % v roce 2023 a 17,6 % v roce 2024, v roce 2025 nedokázalo 15,9 % obyvatel Španělska udržet doma přiměřenou teplotu (EAPN 2026 na základě šetření INE) a energetická chudoba se podle odhadů Oxfam Intermón týká 13 % dětí. V říjnu 2026 navíc průměrný účet za elektřinu v regulovaném tarifu (PVPC) dosáhl podle OCU 92,44 €/měsíc po meziročním nárůstu o 28 %.",
  s:"16. zpráva EAPN (2026), Oxfam Intermón (tisk) a OCU (říjen 2026)",e:"Jak by zima v chladném bytě ovlivnila váš spánek, studium nebo zdraví?"},
 {tag:"Příjmová nerovnost · S80/S20 a Gini",q:"Kolikrát vyšší příjem má ve Španělsku nejbohatších 20 % obyvatel oproti nejchudším 20 % (poměr S80/S20)?",o:["2,1krát vyšší","3,4krát vyšší","5,2krát vyšší","9,8krát vyšší"],key:"5,2krát",
  r:"Analýza EAPN (předběžná zpráva 2026 k šetření INE 2025) uvádí poměr S80/S20 na úrovni 5,2krát vyššího příjmu nejbohatších 20 % oproti nejchudším 20 %, s Giniho koeficientem 30,8. Přestože jde o nejnižší hodnotu ve sledované řadě, 9. zpráva FOESSA (2025) varuje, že nerovnost ve Španělsku je strukturální a že se střední třída zmenšuje a mnoho rodin se tak propadá do zranitelnosti.",
  s:"Předběžná zpráva EAPN (2026) a 9. zpráva FOESSA (2025)",e:"Kdyby měl ve vaší skupině jeden člověk 5krát víc prostředků než jiný, jaká rozhodnutí by se pro každého z nich změnila?"},
 {tag:"Koncentrace bohatství · Majetek",q:"Jaký podíl národního bohatství Španělska vlastnilo nejbohatších 10 % podle zprávy Oxfam Intermón s daty z roku 2022?",o:["24,5 %","38,0 %","53,8 %","76,2 %"],key:"53,8 %",
  r:"Podle zprávy Oxfam Intermón „Nerovnost, a.s., španělská pobočka“ (data z roku 2022) vlastnilo nejbohatších 10 % 53,8 % národního bohatství. Oxfam navíc upozorňuje, že v roce 2025 koncentrace bohatství španělských miliardářů dále zrychlovala, a odhaduje, že daň z majetku kvůli slabinám a mezerám ve své konstrukci nevybere 8 z každých 10 potenciálních eur.",
  s:"Oxfam Intermón (data 2022 a poznámky 2025–2026)",e:"Rozdělte 10 bonbonů ve třídě o 10 lidech: kdyby si jeden člověk nechal víc než polovinu, jak by se cítili ostatní?"},
 {tag:"Územní nerovnost · Regiony",q:"Jaký je roční hrubý rozdíl mezi průměrnou mzdou v regionu, který platí nejvíc (Baskicko), a v regionu, který platí nejméně (Extremadura)?",o:["Asi 2 800 € ročně","Asi 5 400 € ročně","Více než 10 100 € ročně","Více než 18 000 € ročně"],key:"10 190,84 €",
  r:"Podle Ročního šetření struktury mezd INE 2024 (zveřejněno v květnu 2026) byla průměrná hrubá roční mzda v Baskicku 35 170,28 € oproti 24 979,44 € v Extremaduře: roční rozdíl 10 190,84 € (Valencijské společenství bylo pod celostátním průměrem s 26 816,98 €). V ohrožení chudobou nebo vyloučením (AROPE 2025) vynikají Melilla (43,7 %), Ceuta (40,8 %), Andalusie (34,7 %), Kastilie-La Mancha (34,0 %) a Murcie (32,5 %).",
  s:"INE (EAES 2024, květen 2026; Šetření životních podmínek 2025) a Observatoř chudoby",e:"Mělo by místo narození rozhodovat o tom, kolik můžete vydělat za stejnou práci? Proč?"},
 {tag:"Statistická past mezd · Průměr vs. modus",q:"Průměrná hrubá mzda ve Španělsku je 29 540 € ročně, ale jaká je NEJČASTĚJŠÍ mzda (modus, mzda, která se opakuje nejvíc)?",o:["27 800 € hrubého/rok","24 497 € hrubého/rok","16 520 € hrubého/rok","12 100 € hrubého/rok"],key:"16 520,18 €",
  r:"Podle EAES 2024 INE (zveřejněno v květnu 2026) vysoké mzdy táhnou průměr nahoru (29 540,26 € hrubého ročně), ale mediánová mzda (polovina vydělává méně) je 24 497,17 € a nejčastější mzda (modus) klesá na 16 520,18 € hrubého ročně (1 180,01 € hrubého ve 14 výplatách), velmi blízko minimální mzdě (která v roce 2026 vzrostla na 17 094 € hrubého ročně, 1 221 € ve 14 výplatách).",
  s:"INE (EAES 2024, květen 2026) a královský dekret 126/2026",e:"Když ve zprávách slyšíte „průměrná mzda je…“, koho tento údaj vynechává?"},
 {tag:"Chudoba pracujících",q:"Mít práci nezaručuje únik z chudoby. Přibližně jaké procento lidí S PRACÍ je ve Španělsku ohroženo chudobou (třetí nejhorší údaj v EU)?",o:["3,2 %","6,5 %","11,0 %–11,6 %","22,4 %"],key:"11 %–11,6 %",
  r:"Podle údajů Eurostatu zveřejněných v listopadu 2025 a výpočtů Oxfam Intermón je ve Španělsku chudobou ohroženo 11 % až 11,6 % pracujících, téměř o pět bodů nad průměrem EU (8,2 %). 9. zpráva FOESSA (2025) potvrzuje, že zaměstnání ztratilo svou ochrannou funkci: 47,5 % ekonomicky aktivních (11,5 milionu lidí) trpí pracovní nejistotou.",
  s:"Eurostat (listopad 2025), Oxfam Intermón a FOESSA (2025)",e:"Co byste řekli někomu, kdo pracuje každý den, a přesto s penězi nevyjde?"},
 {tag:"Genderový rozdíl v odměňování",q:"O kolik méně vydělávají ve Španělsku ženy v průměru ročně oproti mužům (hrubý roční výdělek)?",o:["O 5 % méně (asi 1 500 €)","O 10 % méně (asi 3 100 €)","O 16 % méně (přes 5 150 €)","O 30 % méně (asi 9 600 €)"],key:"5 152,65 € (~16 %)",
  r:"Konečné EAES 2024 INE (květen 2026) uvádí průměrný roční výdělek 32 057,55 € u mužů oproti 26 904,90 € u žen: o 5 152,65 € méně ročně (rozdíl asi 16 %). Tato nerovnost souvisí s vyšším podílem žen na částečných úvazcích, v hůře placených odvětvích, jako je pohostinství nebo péče, a s kariérou přerušenou rodinnými povinnostmi.",
  s:"INE (EAES 2024, květen 2026)",e:"Jakou pečovatelskou práci u vás doma někdo dělá a kdo ji obvykle dělá?"},
 {tag:"Rozdíl v péči a pracovní volno",q:"Jaké procento neplaceného volna na péči o děti nebo příbuzné ve Španělsku čerpají ženy?",o:["52 %","68 %","87 %","98 %"],key:"87 %",
  r:"Podle údajů z roku 2024, které shromáždila Solidaridad Intergeneracional, připadlo ženám 87 % volna na péči. Údaje ministerstva pro rovnost rovněž ukazují, že 40 % matek muselo kvůli péči přestat pracovat oproti 26 % otců a 42 % dotázaných uvádí potíže se sladěním práce a péče.",
  s:"Solidaridad Intergeneracional (2024) a ministerstvo pro rovnost",e:"Kdyby někdo z vaší rodiny musel přestat pracovat kvůli péči, jak by se rozhodlo, kdo to bude?"},
 {tag:"Genderový rozdíl v důchodech",q:"O kolik nižší důchod mají ve Španělsku ženy v průměru oproti mužům, když sečteme nižší mzdy a přerušení kariéry kvůli péči?",o:["O 12,4 % nižší","O 21,0 % nižší","O 31,5 % nižší","O 48,2 % nižší"],key:"31,5 %",
  r:"Ženy pobírají v průměru o 31,5 % nižší důchody: v lednu 2025 činil průměrný měsíční důchod mužů 1 564,53 € oproti 1 071,76 € u žen (o 492,77 € méně každý měsíc). U mediánového důchodu dosahoval španělský rozdíl 41,1 % oproti 24,9 % v EU. Po rozsudku SDEU z května 2025 se příplatek za genderový rozdíl v roce 2026 (36,90 €/měsíc na dítě ve 14 výplatách, nejvýše za 4 děti) přiznává za stejných podmínek oběma rodičům.",
  s:"Público, Prevención Violencia (2025) a Grupo2000 (2026)",e:"Vzpomeňte si na své babičky a dědečky: jakou práci dělali, která nebyla nikdy placená ani započítaná do důchodu?"},
 {tag:"Dětská chudoba a domácnosti matek samoživitelek",q:"Španělsko má podle UNICEF Španělsko nejvyšší míru dětské chudoby v Evropské unii. Jaké procento dětí a dospívajících je ohroženo chudobou nebo vyloučením (AROPE) a jak vysoká je chudoba v domácnostech matek samoživitelek?",o:["18 % dětí a 25 % u samoživitelek","24 % dětí a 33 % u samoživitelek","33,2 % dětí a 45,8 % u samoživitelek","48 % dětí a 65 % u samoživitelek"],key:"33,2 % / 45,8 %",
  r:"Podle analýzy Plataforma de Infancia k šetření INE 2025 (duben 2026) je 33,2 % dětí a dospívajících (asi 2,6 milionu) ohroženo chudobou nebo sociálním vyloučením. Save the Children (únor 2026) upřesňuje, že 28,4 % nezletilých trpí příjmovou chudobou (oproti 17,8 % lidí nad 18 let) a 12,5 % (téměř milion) žije v hluboké chudobě. V domácnostech matek samoživitelek stoupá chudoba na 45,8 %, víc než dvojnásobek oproti rodinám se dvěma dospělými (22,5 %).",
  s:"Plataforma de Infancia, Save the Children (2026) a UNICEF (2025)",e:"O jaké příležitosti (kroužky, výlety, pomůcky) může dítě přijít kvůli financím své rodiny?"},
 {tag:"Osamostatnění mladých",q:"V jakém průměrném věku odcházejí mladí lidé ve Španělsku z domova a jaké procento 16–29letých se dokázalo osamostatnit?",o:["26,3 let a 34 % samostatných","28,1 let a 23 % samostatných","30,2 let a jen 14,5 % samostatných","33,0 let a 8 % samostatných"],key:"30,2 let · 14,5 %",
  r:"Observatoř osamostatnění 2025 Rady mládeže Španělska (zveřejněno v květnu 2026) zaznamenala historické minimum: samostatně žije jen 14,5 % lidí ve věku 16–29 let, s průměrným věkem odchodu 30,2 let (téměř o 4 roky nad průměrem EU 26,3 let podle Eurostatu v září 2026, oproti 21,3 letům ve Finsku). Průměrný nájem (1 176 €/měsíc) odpovídá 98,7 % průměrné mzdy mladého člověka, takže riziko chudoby mladých nájemníků stoupá z 25,9 % před zaplacením bydlení na 43 % po něm.",
  s:"Rada mládeže Španělska, Observatoř osamostatnění (květen 2026) a Eurostat (září 2026)",e:"V kolika letech byste se chtěli osamostatnit? Co byste k tomu potřebovali?"},
 {tag:"Bydlení jako hnací síla chudoby",q:"Bydlení a energie pohltí třetinu (33,2 %) rozpočtu průměrné španělské domácnosti. Jaké procento celkového rozpočtu jde u 20 % domácností s nejnižšími výdaji (1. kvintil) jen na bydlení/energie a jídlo?",o:["38,0 %","48,5 %","61,5 %","79,0 %"],key:"61,5 %",
  r:"Šetření rozpočtů domácností INE 2025 (červen 2026) ukazuje, že zatímco průměrná domácnost vydává 33,2 % na bydlení/energie a 16,0 % na jídlo (dohromady 49,2 %), 20 % domácností s nejnižšími výdaji věnuje 61,5 % celého rozpočtu jen na bydlení a energie (41,9 %) a jídlo (19,6 %). 9. zpráva FOESSA (2025) rovněž uvádí, že 45 % lidí v nájmu je ohroženo chudobou.",
  s:"INE (Šetření rozpočtů domácností 2025, červen 2026) a FOESSA (2025)",e:"Pokud téměř dvě třetiny peněz jdou na bydlení a jídlo, co zbude na všechno ostatní? Čeho byste se vzdali jako první?"},
 {tag:"Bezdomovectví a hluboké vyloučení",q:"O kolik podle INE vzrostl mezi lety 2022 a 2024 denní průměr lidí bez domova ubytovaných v zařízeních pomoci ve Španělsku?",o:["Klesl o 5,2 %","Vzrostl o 12,0 %","Vzrostl o 57,5 % (na 34 145 lidí denně)","Vzrostl o 120 %"],key:"+57,5 % · 34 145 lidí/den",
  r:"Šetření INE o zařízeních a službách pro lidi bez domova (data 2024, zveřejněno v září 2025) zaznamenalo nárůst o 57,5 % oproti roku 2022 na denní průměr 34 145 dospělých ubytovaných v zařízeních pomoci. V celé společnosti podle 9. zprávy FOESSA (2025) postihuje hluboké sociální vyloučení již 4,3 milionu lidí ve Španělsku, o 52 % víc než v roce 2007.",
  s:"INE (Šetření bezdomovectví 2024, září 2025) a FOESSA (2025)",e:"Když jdete kolem člověka bez domova, co myslíte, že by potřeboval kromě jídla?"},
 {tag:"Původ, rasismus a nehlášení",q:"Míra AROPE u osob se španělským občanstvím je 20,5 %. Na kolik stoupá u cizinců ze zemí mimo EU a jaké procento trestných činů z nenávisti ve Španělsku NENÍ nahlášeno?",o:["28 % AROPE a 40 % nenahlášeno","39 % AROPE a 65 % nenahlášeno","53,5 % AROPE a 90 % nenahlášeno","72 % AROPE a 99 % nenahlášeno"],key:"53,5 % · 90 %",
  r:"Podle šetření INE 2025 je míra AROPE 20,5 % u Španělů, 36,4 % u cizinců z EU a 53,5 % u cizinců ze zbytku světa (2,6krát vyšší). FOESSA však připomíná, že 69 % všech vyloučených osob jsou Španělé. Trestné činy a incidenty z nenávisti navíc v roce 2025 vzrostly o 23,63 % na 2 417 případů (38,64 % z důvodu rasismu/xenofobie, přičemž podle FSG/FOESSA trpí hlubokým vyloučením 7 z 10 romských dětí), a studie ONDOD a OBERAXE (2026) dochází k závěru, že 90 % trestných činů z nenávisti zůstává nenahlášeno.",
  s:"INE (Šetření životních podmínek 2025), ONDOD/OBERAXE (2025–2026) a FSG/FOESSA",e:"Proč si myslíte, že 9 z 10 obětí nenávisti čin nenahlásí? Co by potřebovaly, aby se cítily v bezpečí?"},
 {tag:"Vzdělávací nerovnost a mezigenerační dědictví",q:"Předčasné odchody ze vzdělávání ve Španělsku klesly v roce 2025 na 12,8 % (oproti 9,4 % v EU v roce 2024), ale jaké rozpětí dělí region s nejnižší mírou od regionu s nejvyšší a kolikrát zvyšuje riziko hlubokého vyloučení nedokončení povinného středního vzdělání (ESO)?",o:["Od 8 % do 15 %, riziko ×1,3","Od 3,8 % (Baskicko) do 20,6 % (Murcie), riziko ×2,7","Od 1 % do 11 %, riziko ×1,8","Od 10 % do 35 %, riziko ×5,0"],key:"3,8 %–20,6 % · ×2,7",
  r:"Funcas (data 2025) uvádí celostátní míru předčasných odchodů 12,8 % (15,9 % u chlapců oproti 9,5 % u dívek), zatímco regionální data podle metodiky Eurostat-INE ukazují rozdíly od 3,8 % v Baskicku po 20,6 % v Murcii. 9. zpráva FOESSA (2025) dochází k závěru, že děti rodičů s nízkým vzděláním mají více než dvojnásobnou pravděpodobnost upadnout do chudoby a že nedokončení ESO zvyšuje riziko hlubokého vyloučení 2,7krát. K tomu přistupují průměrné výdaje na začátek školního roku 2 484 € na dítě ročně podle OCU (srpen 2026).",
  s:"Funcas (2025), Eurostat-INE, 9. zpráva FOESSA (2025) a OCU (srpen 2026)",e:"Jaká pomoc (doma, ve škole, od spolužáků) pomůže, aby někdo neodešel ze školy?"},
 {tag:"Zubní a duševní zdraví",q:"Jaké procento obyvatel Španělska uvádí nenaplněné potřeby zubní péče (téměř trojnásobek 4,6 % v EU podle Eurostatu 2024), hlavně proto, že je příliš drahá?",o:["4,8 %","8,2 %","12,0 %","25,5 %"],key:"12 %",
  r:"Podle údajů Eurostatu a odvětvových analýz z let 2025–2026 má 12 % obyvatel Španělska nenaplněné potřeby zubní péče (oproti 4,6 % v EU) kvůli omezenému krytí z veřejných zdrojů a soukromým mediánovým cenám podle průzkumu OCU 2024: 110 € za plombu, 250 € za ošetření kořenových kanálků a 1 850 € za implantát. V oblasti duševního zdraví uváděl celostátní tisk v letech 2021–2023 veřejné pokrytí 6 klinických psychologů na 100 000 obyvatel oproti evropskému průměru 18.",
  s:"Eurostat (2024), OCU (2024) a celostátní tisk (2021–2023)",e:"Dokážete si představit, že vás týdny bolí zub, protože nejsou peníze na zubaře? Jak by to ovlivnilo váš den?"},
 {tag:"Digitální propast a umělá inteligence",q:"Přestože internet v roce 2025 používalo 96,3 % lidí ve věku 16–74 let, jaký rozdíl dělí lidi s nejnižším vzděláním od vysokoškoláků v používání generativní AI a kolik dospívajících z rodin s nejnižšími příjmy nemá digitální zařízení ke studiu?",o:["Rozdíl 12 bodů v AI a 1 z 50 dospívajících","25 bodů v AI a 1 z 25 dospívajících","Více než 50 bodů v AI a 1 z 10 zranitelných dospívajících","85 bodů v AI a polovina dospívajících"],key:">50 bodů · 1 z 10",
  r:"Zpráva odborů UGT o digitální propasti a AI vycházející z šetření ICT 2025 INE uvádí rozdíl více než 50 procentních bodů v používání generativní AI mezi lidmi s nejnižším vzděláním a vysokoškoláky (a 70 bodů mezi věkovými skupinami 16–24 a 65–74 let). Navíc 6,2 % španělských domácností stále nemá připojení k internetu a Plataforma de Infancia (únor 2025) upozorňuje, že 1 z 10 patnáctiletých z nejnižšího socioekonomického kvartilu nemá doma vhodné digitální zařízení ke vzdělávání.",
  s:"UGT k šetření ICT 2025 INE a Plataforma de Infancia (únor 2025)",e:"Jak byste dělali úkoly na tento týden bez počítače a dobrého připojení doma?"},
 {tag:"Digitální násilí a genderová kontrola mezi mladými",q:"Podle Barometru mládeže a genderu 2025 (Fad Juventud a vládní delegace proti genderovému násilí) jaké procento mladých žen uvádí, že jim partner kontroloval mobil?",o:["7,5 %","14,2 %","27,3 %","49,0 %"],key:"27,3 %",
  r:"V Barometru mládeže a genderu 2025 (průzkum mezi 3 327 mladými lidmi ve věku 15–29 let) uvedlo 27,3 % mladých žen, že jim partner kontroloval mobil, a pozdější studie Fad Juventud (květen 2026) zjistila, že 57 % mladých ve Španělsku zažilo v roce 2025 nějakou formu digitální agrese. Tyto každodenní projevy digitální kontroly existují vedle 106 549 aktivních případů genderového násilí evidovaných v systému VioGén v roce 2026.",
  s:"Barometr mládeže a genderu 2025 (Fad / DGVG), Fad Juventud (květen 2026) a VioGén (2026)",e:"Kde je hranice mezi zájmem o partnera a jeho kontrolou? Uveďte konkrétní příklady."}
]

q:[
 {tag:"Armut und Ausgrenzung · AROPE-Quote",q:"Wie viel Prozent der in Spanien lebenden Bevölkerung sind laut den neuesten endgültigen Daten des INE (spanisches Statistikamt) von Armut oder sozialer Ausgrenzung bedroht (AROPE-Quote)?",o:["11,4 %","18,2 %","25,7 %","38,5 %"],key:"25,7 %",
  r:"25,7 % der in Spanien lebenden Bevölkerung (rund 12,6 Millionen Menschen) waren 2025 laut der Erhebung über Lebensbedingungen des INE (veröffentlicht im Februar 2026 mit Einkommensdaten von 2024) und dem 16. EAPN-Bericht von Armut oder sozialer Ausgrenzung bedroht. Der Indikator vereint drei Dimensionen: 19,5 % leben unter der Einkommensarmutsgrenze (weniger als 12.220 € pro Jahr und Verbrauchseinheit, etwa 1.018 €/Monat), 8,1 % leiden unter erheblicher materieller und sozialer Entbehrung (fast vier Millionen Menschen) und 8,0 % leben in Haushalten mit geringer Erwerbsintensität.",
  s:"INE (Erhebung über Lebensbedingungen 2025, veröff. Feb. 2026) und 16. EAPN-Bericht (2026)",e:"Wenn jede vierte Person in dieser Lage ist: Auf welche alltäglichen Dinge verzichten diese Familien, ohne dass man es von außen merkt?"},
 {tag:"Finanzielle Verwundbarkeit · Unerwartete Ausgaben",q:"Wie viel Prozent der Bevölkerung in Spanien konnten 2025 unerwartete Ausgaben NICHT bezahlen?",o:["14,5 %","22,0 %","36,4 %","54,1 %"],key:"36,4 %",
  r:"Laut der Erhebung über Lebensbedingungen 2025 des INE (veröffentlicht im Februar 2026) konnten 36,4 % der Bevölkerung unerwartete Ausgaben nicht bestreiten (gegenüber 35,8 % im Jahr 2024). Außerdem kommen laut EAPN (2026) 46,0 % nur mit gewissen Schwierigkeiten über den Monat, 8,5 % mit „großen Schwierigkeiten“ (in Kastilien-La Mancha bis zu 12,7 %, in Murcia 12,1 % und auf den Kanaren 11,5 %), und 32,2 % können sich nicht einmal eine Woche Urlaub außer Haus im Jahr leisten.",
  s:"INE (Erhebung über Lebensbedingungen 2025, veröff. Feb. 2026) und 16. EAPN-Bericht (2026)",e:"Stellt euch vor, die Waschmaschine geht kaputt oder jemand muss zum Zahnarzt: Wie fühlt sich jemand, der weiß, dass er das nicht bezahlen kann?"},
 {tag:"Energiearmut",q:"Wie viel Prozent der Bevölkerung in Spanien konnten 2025 ihre Wohnung nicht angemessen warm halten?",o:["5,2 %","15,9 %","28,4 %","41,0 %"],key:"15,9 %",
  r:"Obwohl sich der Wert gegenüber 20,7 % (2023) und 17,6 % (2024) verbessert hat, konnten 2025 15,9 % der Bevölkerung in Spanien ihre Wohnung nicht angemessen temperieren (EAPN 2026 auf Basis der INE-Erhebung), und Energiearmut betrifft laut Schätzungen von Oxfam Intermón 13 % der Kinder. Im Oktober 2026 erreichte die durchschnittliche Stromrechnung im regulierten Tarif (PVPC) laut OCU zudem 92,44 €/Monat nach einem Anstieg von 28 % im Jahresvergleich.",
  s:"16. EAPN-Bericht (2026), Oxfam Intermón (Presse) und OCU (Okt. 2026)",e:"Wie würde ein Winter in einer kalten Wohnung euren Schlaf, euer Lernen oder eure Gesundheit beeinflussen?"},
 {tag:"Einkommensungleichheit · S80/S20 und Gini",q:"Wie viel Mal mehr Einkommen erhalten in Spanien die reichsten 20 % der Bevölkerung im Vergleich zu den ärmsten 20 % (S80/S20-Verhältnis)?",o:["2,1-mal mehr","3,4-mal mehr","5,2-mal mehr","9,8-mal mehr"],key:"5,2-mal",
  r:"Die Analyse von EAPN (Vorbericht 2026 zur INE-Erhebung 2025) beziffert das S80/S20-Verhältnis auf 5,2-mal mehr Einkommen für die reichsten 20 % gegenüber den ärmsten 20 %, bei einem Gini-Index von 30,8. Obwohl dies der niedrigste Wert der untersuchten Zeitreihe ist, warnt der 9. FOESSA-Bericht (2025), dass die Ungleichheit in Spanien strukturell ist und die Mittelschicht schrumpft, wodurch viele Familien in die Verwundbarkeit abrutschen.",
  s:"EAPN-Vorbericht (2026) und 9. FOESSA-Bericht (2025)",e:"Wenn in eurer Gruppe eine Person 5-mal so viele Mittel hätte wie eine andere: Welche Entscheidungen würden sich für beide ändern?"},
 {tag:"Vermögenskonzentration",q:"Welchen Anteil des spanischen Nationalvermögens besaßen die reichsten 10 % laut dem Bericht von Oxfam Intermón mit Daten von 2022?",o:["24,5 %","38,0 %","53,8 %","76,2 %"],key:"53,8 %",
  r:"Laut dem Bericht „Ungleichheit AG, Filiale Spanien“ von Oxfam Intermón (Daten von 2022) besaßen die reichsten 10 % 53,8 % des Nationalvermögens. Oxfam weist zudem darauf hin, dass sich die Vermögenskonzentration der spanischen Milliardäre 2025 weiter beschleunigt hat, und schätzt, dass die Vermögensteuer wegen Schwächen und Schlupflöchern 8 von 10 möglichen Euro nicht einnimmt.",
  s:"Oxfam Intermón (Daten 2022 und Hinweise 2025–2026)",e:"Verteilt 10 Bonbons in einer Klasse mit 10 Personen: Wenn eine Person mehr als die Hälfte behält, wie fühlen sich die anderen?"},
 {tag:"Regionale Ungleichheit · Autonome Gemeinschaften",q:"Wie groß ist der jährliche Bruttounterschied zwischen dem Durchschnittsgehalt der Region, die am meisten zahlt (Baskenland), und der, die am wenigsten zahlt (Extremadura)?",o:["Etwa 2.800 € pro Jahr","Etwa 5.400 € pro Jahr","Mehr als 10.100 € pro Jahr","Mehr als 18.000 € pro Jahr"],key:"10.190,84 €",
  r:"Laut der jährlichen Verdienststrukturerhebung 2024 des INE (veröffentlicht im Mai 2026) betrug das durchschnittliche Bruttojahresgehalt im Baskenland 35.170,28 € gegenüber 24.979,44 € in Extremadura: eine jährliche Lücke von 10.190,84 € (die Region Valencia lag mit 26.816,98 € unter dem Landesdurchschnitt). Beim Armuts- oder Ausgrenzungsrisiko (AROPE 2025) stechen Melilla (43,7 %), Ceuta (40,8 %), Andalusien (34,7 %), Kastilien-La Mancha (34,0 %) und Murcia (32,5 %) hervor.",
  s:"INE (EAES 2024, Mai 2026; Erhebung über Lebensbedingungen 2025) und Armutsobservatorium",e:"Sollte der Geburtsort bestimmen, wie viel man für dieselbe Arbeit verdienen kann? Warum?"},
 {tag:"Statistische Gehaltsfalle · Mittelwert vs. Modus",q:"Das durchschnittliche Bruttogehalt in Spanien liegt bei 29.540 € im Jahr, aber was ist das HÄUFIGSTE Gehalt (der Modus, das am häufigsten vorkommende Gehalt)?",o:["27.800 € brutto/Jahr","24.497 € brutto/Jahr","16.520 € brutto/Jahr","12.100 € brutto/Jahr"],key:"16.520,18 €",
  r:"Laut EAES 2024 des INE (veröffentlicht im Mai 2026) ziehen hohe Gehälter den Durchschnitt nach oben (29.540,26 € brutto/Jahr), aber das mittlere Gehalt (Median, die Hälfte verdient weniger) liegt bei 24.497,17 €, und das häufigste Gehalt (Modus) sinkt auf 16.520,18 € brutto im Jahr (1.180,01 € brutto in 14 Zahlungen), sehr nah am gesetzlichen Mindestlohn (der 2026 auf 17.094 € brutto im Jahr stieg, 1.221 € in 14 Zahlungen).",
  s:"INE (EAES 2024, Mai 2026) und Königliches Dekret 126/2026",e:"Wenn ihr in den Nachrichten „das Durchschnittsgehalt beträgt …“ hört: Wen lässt diese Zahl außen vor?"},
 {tag:"Erwerbsarmut · Working Poor",q:"Ein Job schützt nicht vor Armut. Wie viel Prozent der Menschen MIT ARBEIT sind in Spanien ungefähr armutsgefährdet (der drittschlechteste Wert in der EU)?",o:["3,2 %","6,5 %","11,0 %–11,6 %","22,4 %"],key:"11 %–11,6 %",
  r:"Laut im November 2025 veröffentlichten Eurostat-Daten und Berechnungen von Oxfam Intermón sind in Spanien zwischen 11 % und 11,6 % der Erwerbstätigen von Erwerbsarmut bedroht, fast fünf Punkte über dem EU-Durchschnitt (8,2 %). Der 9. FOESSA-Bericht (2025) bestätigt, dass Arbeit ihre Schutzwirkung verloren hat: 47,5 % der Erwerbsbevölkerung (11,5 Millionen Menschen) leiden unter prekären Arbeitsverhältnissen.",
  s:"Eurostat (Nov. 2025), Oxfam Intermón und FOESSA (2025)",e:"Was würdet ihr jemandem sagen, der jeden Tag arbeitet und trotzdem nicht über die Runden kommt?"},
 {tag:"Geschlechtsspezifisches Lohngefälle",q:"Wie viel weniger verdienen Frauen in Spanien im Jahresdurchschnitt gegenüber Männern (Bruttojahresverdienst)?",o:["5 % weniger (etwa 1.500 €)","10 % weniger (etwa 3.100 €)","16 % weniger (über 5.150 €)","30 % weniger (etwa 9.600 €)"],key:"5.152,65 € (~16 %)",
  r:"Die endgültige EAES 2024 des INE (Mai 2026) verzeichnet einen durchschnittlichen Jahresverdienst von 32.057,55 € bei Männern gegenüber 26.904,90 € bei Frauen: 5.152,65 € weniger pro Jahr (eine Lücke von etwa 16 %). Diese Ungleichheit hängt mit dem höheren Anteil von Frauen in Teilzeit, in schlechter bezahlten Branchen wie Gastgewerbe oder Pflege und mit durch Familienpflichten unterbrochenen Erwerbsbiografien zusammen.",
  s:"INE (EAES 2024, Mai 2026)",e:"Welche Sorgearbeit wird bei euch zu Hause erledigt, und wer macht sie normalerweise?"},
 {tag:"Sorgelücke und Freistellungen",q:"Wie viel Prozent der Freistellungen zur Betreuung von Kindern oder Angehörigen in Spanien werden von Frauen beantragt?",o:["52 %","68 %","87 %","98 %"],key:"87 %",
  r:"Laut von Solidaridad Intergeneracional gesammelten Daten von 2024 entfielen 87 % der Betreuungsfreistellungen auf Frauen. Daten des Gleichstellungsministeriums zeigen zudem, dass 40 % der Mütter wegen Betreuung aufhören mussten zu arbeiten, gegenüber 26 % der Väter, und 42 % der Befragten berichten von Schwierigkeiten, Beruf und Pflege zu vereinbaren.",
  s:"Solidaridad Intergeneracional (2024) und Gleichstellungsministerium",e:"Wenn jemand in eurer Familie aufhören müsste zu arbeiten, um jemanden zu pflegen: Wie würde entschieden, wer das übernimmt?"},
 {tag:"Rentenlücke zwischen den Geschlechtern",q:"Wie viel niedriger ist die Rente von Frauen in Spanien im Durchschnitt gegenüber Männern, wenn sich niedrigere Löhne und Pflegeunterbrechungen summieren?",o:["12,4 % niedriger","21,0 % niedriger","31,5 % niedriger","48,2 % niedriger"],key:"31,5 %",
  r:"Frauen erhalten im Durchschnitt 31,5 % weniger Rente: Im Januar 2025 lag die durchschnittliche Monatsrente der Männer bei 1.564,53 € gegenüber 1.071,76 € bei Frauen (492,77 € weniger pro Monat). Bei der Medianrente erreichte die spanische Lücke 41,1 % gegenüber 24,9 % in der EU. Nach dem EuGH-Urteil vom Mai 2025 wird der Zuschlag zur Rentenlücke 2026 (36,90 €/Monat pro Kind in 14 Zahlungen, höchstens 4 Kinder) beiden Elternteilen zu gleichen Bedingungen gewährt.",
  s:"Público, Prevención Violencia (2025) und Grupo2000 (2026)",e:"Denkt an eure Großmütter und Großväter: Welche Arbeit haben sie geleistet, die nie bezahlt oder für die Rente angerechnet wurde?"},
 {tag:"Kinderarmut und Haushalte alleinerziehender Mütter",q:"Spanien hat laut UNICEF Spanien die höchste Kinderarmutsquote der Europäischen Union. Wie viel Prozent der Kinder und Jugendlichen sind von Armut oder Ausgrenzung bedroht (AROPE), und wie hoch ist die Armut in Haushalten alleinerziehender Mütter?",o:["18 % der Kinder und 25 % bei Alleinerziehenden","24 % der Kinder und 33 % bei Alleinerziehenden","33,2 % der Kinder und 45,8 % bei Alleinerziehenden","48 % der Kinder und 65 % bei Alleinerziehenden"],key:"33,2 % / 45,8 %",
  r:"Laut der Analyse der Plataforma de Infancia zur INE-Erhebung 2025 (April 2026) sind 33,2 % der Kinder und Jugendlichen (rund 2,6 Millionen) von Armut oder sozialer Ausgrenzung bedroht. Save the Children (Februar 2026) präzisiert, dass 28,4 % der Minderjährigen unter Einkommensarmut leiden (gegenüber 17,8 % der über 18-Jährigen) und 12,5 % (fast eine Million) in schwerer Armut leben. In Haushalten alleinerziehender Mütter steigt die Armut auf 45,8 %, mehr als doppelt so hoch wie in Familien mit zwei Erwachsenen (22,5 %).",
  s:"Plataforma de Infancia, Save the Children (2026) und UNICEF (2025)",e:"Welche Chancen (Freizeitaktivitäten, Ausflüge, Material) kann ein Kind wegen der finanziellen Lage seiner Familie verpassen?"},
 {tag:"Auszug junger Menschen",q:"In welchem Durchschnittsalter ziehen junge Menschen in Spanien von zu Hause aus, und wie viel Prozent der 16- bis 29-Jährigen leben eigenständig?",o:["26,3 Jahre und 34 % eigenständig","28,1 Jahre und 23 % eigenständig","30,2 Jahre und nur 14,5 % eigenständig","33,0 Jahre und 8 % eigenständig"],key:"30,2 Jahre · 14,5 %",
  r:"Das Emanzipations-Observatorium 2025 des Spanischen Jugendrats (veröffentlicht im Mai 2026) verzeichnete einen historischen Tiefstand: Nur 14,5 % der 16- bis 29-Jährigen leben eigenständig, bei einem durchschnittlichen Auszugsalter von 30,2 Jahren (fast 4 Jahre über dem EU-Durchschnitt von 26,3 Jahren laut Eurostat im September 2026, gegenüber 21,3 Jahren in Finnland). Die Durchschnittsmiete (1.176 €/Monat) entspricht 98,7 % des Durchschnittsgehalts junger Menschen, wodurch das Armutsrisiko junger Mieterinnen und Mieter von 25,9 % vor Zahlung der Wohnkosten auf 43 % danach steigt.",
  s:"Spanischer Jugendrat, Emanzipations-Observatorium (Mai 2026) und Eurostat (Sept. 2026)",e:"Mit wie vielen Jahren würdet ihr gern ausziehen? Was bräuchtet ihr dafür?"},
 {tag:"Wohnen als Armutsmotor",q:"Wohnen und Nebenkosten verschlingen ein Drittel (33,2 %) des Budgets eines durchschnittlichen spanischen Haushalts. Welchen Anteil ihres Gesamtbudgets geben die 20 % der Haushalte mit den niedrigsten Ausgaben (1. Quintil) allein für Wohnen/Nebenkosten und Lebensmittel aus?",o:["38,0 %","48,5 %","61,5 %","79,0 %"],key:"61,5 %",
  r:"Die Haushaltsbudgeterhebung 2025 des INE (Juni 2026) zeigt: Während der Durchschnittshaushalt 33,2 % für Wohnen/Nebenkosten und 16,0 % für Lebensmittel ausgibt (zusammen 49,2 %), verwenden die 20 % der Haushalte mit den niedrigsten Ausgaben 61,5 % ihres gesamten Budgets allein für Wohnen und Energie (41,9 %) plus Lebensmittel (19,6 %). Der 9. FOESSA-Bericht (2025) weist zudem darauf hin, dass 45 % der Mieterinnen und Mieter armutsgefährdet sind.",
  s:"INE (Haushaltsbudgeterhebung 2025, Juni 2026) und FOESSA (2025)",e:"Wenn fast zwei Drittel des Geldes für Wohnung und Essen draufgehen, was bleibt für alles andere? Worauf würdet ihr zuerst verzichten?"},
 {tag:"Wohnungslosigkeit und schwere Ausgrenzung",q:"Um wie viel stieg laut INE zwischen 2022 und 2024 der Tagesdurchschnitt wohnungsloser Menschen, die in Hilfseinrichtungen in Spanien untergebracht waren?",o:["Er sank um 5,2 %","Er stieg um 12,0 %","Er stieg um 57,5 % (auf 34.145 Personen pro Tag)","Er stieg um 120 %"],key:"+57,5 % · 34.145 Personen/Tag",
  r:"Die INE-Erhebung über Einrichtungen und Dienste für wohnungslose Menschen (Daten 2024, veröffentlicht im September 2025) verzeichnete einen Anstieg um 57,5 % gegenüber 2022 auf durchschnittlich 34.145 Erwachsene pro Tag in Hilfseinrichtungen. Gesamtgesellschaftlich betrifft schwere soziale Ausgrenzung laut dem 9. FOESSA-Bericht (2025) inzwischen 4,3 Millionen Menschen in Spanien, 52 % mehr als 2007.",
  s:"INE (Erhebung Wohnungslosigkeit 2024, Sept. 2025) und FOESSA (2025)",e:"Wenn ihr an einem wohnungslosen Menschen vorbeigeht: Was glaubt ihr, braucht er außer Essen?"},

/* Colores y accesibilidad WCAG */
function hexToRgb(h){h=h.replace("#","");if(h.length===3)h=h.split("").map(x=>x+x).join("");const n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255];}
function rgbToHex(r,g,b){return "#"+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,"0")).join("").toUpperCase();}
function relLum(hex){const [r,g,b]=hexToRgb(hex).map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});return 0.2126*r+0.7152*g+0.0722*b;}
function textOn(hex){return relLum(hex)>0.179?"#0F172A":"#FFFFFF";}
function mix(hex,with_,k){const a=hexToRgb(hex),b=hexToRgb(with_);return rgbToHex(a[0]*(1-k)+b[0]*k,a[1]*(1-k)+b[1]*k,a[2]*(1-k)+b[2]*k);}
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;}return [h,s,l];}
function applyTheme(p){

 root.setProperty("--brand-text-on-secondary",textOn(p.secondary));
}
function extractColors(src){
 return new Promise((resolve,reject)=>{
  const img=new Image();
  img.onload=()=>{
   try{
    const S=120, ratio=Math.min(S/(img.naturalWidth||S),S/(img.naturalHeight||S),1)||1;
    const w=Math.max(1,Math.round((img.naturalWidth||S)*ratio)), h=Math.max(1,Math.round((img.naturalHeight||S)*ratio));
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.style.display="none";
    const ctx=cv.getContext("2d");ctx.drawImage(img,0,0,w,h);
    const d=ctx.getImageData(0,0,w,h).data, buckets={};
    for(let i=0;i<d.length;i+=4){
     const r=d[i],g=d[i+1],b=d[i+2],a=d[i+3];
     if(a<128) continue;
     if(r>235&&g>235&&b>235) continue;
     if(r<25&&g<25&&b<25) continue;
     const k=(r>>4)+"-"+(g>>4)+"-"+(b>>4);
     const o=buckets[k]||(buckets[k]={n:0,r:0,g:0,b:0});o.n++;o.r+=r;o.g+=g;o.b+=b;
    }
    const list=Object.values(buckets).map(o=>{const r=o.r/o.n,g=o.g/o.n,b=o.b/o.n;const [hh,s,l]=rgbToHsl(r,g,b);return {n:o.n,hex:rgbToHex(r,g,b),h:hh,s,l};});
    if(!list.length) return reject(t("errNoColors"));
    const score=c=>c.n*(0.35+c.s)*(c.l>0.12&&c.l<0.85?1:0.3);
    list.sort((a,b)=>score(b)-score(a));
    const primary=list[0];
    const hd=(a,b)=>{const x=Math.abs(a-b)%360;return x>180?360-x:x;};
    const cands=list.filter(c=>c!==primary&&c.s>0.25&&c.l>0.18&&c.l<0.80&&(hd(c.h,primary.h)>28||Math.abs(c.l-primary.l)>0.25))
                    .sort((a,b)=>b.s*Math.sqrt(b.n)-a.s*Math.sqrt(a.n));
    const secondary=cands.length?cands[0].hex:(primary.l>0.5?mix(primary.hex,"#000000",0.35):mix(primary.hex,"#FFFFFF",0.45));
    resolve({primary:primary.hex,secondary});
   }catch(err){reject(t("errRead")+" "+err);}
  };
  img.onerror=()=>reject(t("errLoad"));
  img.src=src;
 });
}

function rentOf(c){
 if(c.viviendaModo==="habitacion") return 400;
 if(c.viviendaModo==="manual") return +c.rentManual||0;
 const d=DISTRICTS.find(x=>x[0]===c.distrito)||DISTRICTS[0]; return (c.fuente==="idealista"?d[1]:d[2])*c.m2;
}
function cartWeekly(c){return PRODUCTS.reduce((s,p)=>s+(c.cart[p.id]||0)*p.p,0);}
function scaleOf(c){const h=HOUSEHOLDS[c.hogar];return 1+0.5*(h.a-1)+0.3*h.m;}
function computeBudget(c){
 const h=HOUSEHOLDS[c.hogar], rent=rentOf(c);
 const luz = c.luzModo==="manual"?+c.luzManual:LUZ[c.luzModo];
 const fibra = c.fibraModo==="manual"?+c.fibraManual:FIBRA[c.fibraModo];
 const comida = c.comidaModo==="carrito"? cartWeekly(c)*4*scaleOf(c)+(+c.frescos) : +c.comidaManual;
 const tr=TRANSPORT[c.transporte]; const transporte = tr.per? tr.p*(+c.abonos||0) : tr.p;
 const educacion = c.eduModo==="manual"? +c.eduManual : EDU[c.eduModo]*h.m;
 const cats = {vivienda:rent+luz+(+c.aguaGas),comida,transporte,rest:+c.rest,ocio:+c.ocio,vestido:+c.vestido,sanidad:+c.sanidad,cuidado:+c.cuidado,seguros:+c.seguros,muebles:+c.muebles,fibra,educacion,alcohol:+c.alcohol};
 const total=Object.values(cats).reduce((a,b)=>a+b,0);
 const income=+c.income||0, effort= income>0? rent/income : 1;
 const pen=[]; // [clave, puntos, vars]
 const foodMin=130*h.a+100*h.m;
 if(comida<foodMin*0.5) pen.push(["penFood1",35,{m:foodMin}]);
 else if(comida<foodMin) pen.push(["penFood2",20]);
 if(c.comidaModo==="carrito"&&(+c.frescos)<25*(h.a+h.m)) pen.push(["penDry",10]);
 if(luz<=0||(+c.aguaGas)<=0) pen.push(["penEnergy",25]);
 else if(luz<30) pen.push(["penLight",8]);
 if(rent<=0) pen.push(["penHome",30]);
 if(cats.ocio+cats.rest<=0) pen.push(["penLeisure",10]);
 if(cats.ocio+cats.rest<=0&&transporte<=0) pen.push(["penIsol",12]);
 if(h.m>0&&(c.viviendaModo==="habitacion"||(c.viviendaModo==="piso"&&c.m2<45))) pen.push(["penSpace",20]);
 if(h.m>0&&educacion<=0) pen.push(["penEdu",10]);
 if(cats.sanidad<=0) pen.push(["penHealth",5]);
 if(cats.vestido<=0) pen.push(["penClothes",5]);
 if(cats.cuidado<=0) pen.push(["penCare",5]);
 if(effort>0.5) pen.push(["penEff50",10]);
 else if(effort>0.3) pen.push(["penEff30",5]);
 const wb=clamp(100-pen.reduce((s,p)=>s+p[1],0),0,100);
 const fixed=rent+luz+(+c.aguaGas)+fibra+transporte+educacion+cats.seguros;
 return {cats,total,income,rent,effort,pen,wb,fixed,variable:total-fixed};
}

/* Motor del juego */
function startGame(){
 const c=G().cfg, snap=computeBudget(c);
 const saldo=(+c.ahorros)+snap.income;
 G().run={week:0,saldo,wbAdj:0,snap,history:[{parts:[["hStart",{i:snap.income,s:+c.ahorros}]],s:saldo}],events:[],extraW4:0,cutW4:0,over:false,closed:false,triggered:false,timerLeft:25,result:null};
 clearInterval(gTimer);
 if(c.trigger==="timer"){
  gTimer=setInterval(()=>{const r=G().run; if(!r||r.over||r.triggered){clearInterval(gTimer);return;}
   r.timerLeft--; const el=$("#gtimer"); if(el) el.textContent=r.timerLeft;
   if(r.timerLeft<=0){clearInterval(gTimer); fireSurprise(Math.floor(Math.random()*10),false,null);}},1000);
 }
 renderGame();
}
function processWeek(){
 const r=G().run; if(!r||r.over) return;
 const w=r.week+1, varW=r.snap.variable/4;
 let gastos=(w===1?r.snap.fixed:0)+varW; const parts=[["hWeek",{w,g:gastos}]];
 if(w===4){
  const cut=Math.min(r.cutW4,varW); gastos+=r.extraW4-cut;
  if(r.extraW4) parts.push(["hDeferred",{x:r.extraW4}]);
  if(cut) parts.push(["hCut",{x:cut}]);
 }
 r.saldo-=gastos; r.week=w; r.history.push({parts,s:r.saldo});
 if(r.saldo<0) endGame(false,"loseRed","loseRedMsg",{w,s:r.saldo});
 renderGame();
}
function advance(){
 const r=G().run, c=G().cfg; if(!r||r.over) return;
 if(r.week===2&&c.trigger==="semana3"&&!r.triggered){fireSurprise(Math.floor(Math.random()*10),false,()=>processWeek());return;}
 processWeek();
}
function closeMonth(){
 const r=G().run; if(!r) return; r.closed=true;
 const wb=Math.round(clamp(r.snap.wb+r.wbAdj,0,100));
 if(r.saldo<0) endGame(false,"loseRed2","loseRed2Msg",{s:r.saldo});
 else if(wb<60) endGame(false,"loseWb","loseWbMsg",{s:r.saldo,w:wb});
 else endGame(true,"win","winMsg",{s:r.saldo,w:wb});
 renderGame();
}
function endGame(win,tk,mk,v){
 const r=G().run; r.over=true; r.result={win,tk,mk,v}; clearInterval(gTimer);
 G().lastResult={win,tk,saldo:r.saldo,wb:clamp(r.snap.wb+r.wbAdj,0,100),income:r.snap.income,total:r.snap.total,effort:r.snap.effort,hogar:G().cfg.hogar,events:r.events.map(e=>({k:e.k,v:e.v})),date:new Date().toISOString()};
}
function fireSurprise(idx,synced,after){
 const r=G().run; if(!r||r.over) return; r.triggered=true; clearInterval(gTimer);
 const [mn,mx]=SURPRISES[idx], S=D().surprises[idx];
 const amount= synced? Math.round((mn+mx)/2) : Math.round(mn+Math.random()*(mx-mn));
 const varW=r.snap.variable/4, canCut=r.week<4;
 const cutNow=Math.max(0,amount-varW);
 const cutWb=Math.min(25,Math.round(Math.min(amount,varW)/10)+4);
 const fee=Math.round(amount*0.5*1.10*100)/100;
 openModal(`<div class="modal urgent" role="alertdialog" aria-modal="true" aria-labelledby="sTitle">
  <p style="margin:0;font-weight:900;color:var(--bad)"><span class="siren">🚨</span> ${synced?t("sSynced",{n:idx+1}):t("sFamily")}</p>
  <h2 id="sTitle">${esc(S.n)}</h2>
  <p style="font-size:2rem;font-weight:900;margin:0;color:var(--bad)">${eur(amount)}</p>
  <p class="small muted">${esc(S.why)} ${t("sRange",{a:eur(mn),b:eur(mx)})}</p>
  <p class="small">${t("sBalance",{s:eur(r.saldo)})}</p>
  <button class="choice" data-act="s-pay" data-a="${amount}" data-i="${idx}"><strong>${t("sPay")}</strong><br><span class="small">${t("sPayD",{a:eur(amount)})}</span></button>
  <button class="choice" data-act="s-cut" data-a="${amount}" data-i="${idx}" ${canCut?"":"disabled"}><strong>${t("sCut")}</strong><br><span class="small">${canCut?t("sCutD",{x:cutNow>0?t("sCutX",{a:eur(cutNow)}):"",w:cutWb}):t("sCutNo")}</span></button>
  <button class="choice" data-act="s-split" data-a="${amount}" data-i="${idx}" ${canCut?"":"disabled"}><strong>${t("sSplit")}</strong><br><span class="small">${canCut?t("sSplitD",{a:eur(amount/2),b:eur(fee)}):t("sSplitNo")}</span></button>
 </div>`);
 pendingAfter=after;
}
function resolveSurprise(kind,amount,si){
 const r=G().run, varW=r.snap.variable/4;
 if(kind==="pay"){r.saldo-=amount;r.wbAdj-=3;r.events.push({k:"evPay",v:{si,a:amount},wb:3});r.history.push({parts:[["hPay",{si,a:amount}]],s:r.saldo});}
 if(kind==="cut"){const now=Math.max(0,amount-varW),cut=amount-now,w=Math.min(25,Math.round(cut/10)+4);r.saldo-=now;r.cutW4+=cut;r.wbAdj-=w;r.events.push({k:"evCut",v:{si,a:cut},wb:w});
  const parts=[["hCutEv",{si}]]; if(now) parts.push(["hCutNow",{a:now}]); r.history.push({parts,s:r.saldo});}
 if(kind==="split"){const half=amount/2,fee=Math.round(half*1.10*100)/100;r.saldo-=half;r.extraW4+=fee;r.wbAdj-=8;r.events.push({k:"evSplit",v:{si},wb:8});r.history.push({parts:[["hSplit",{si,a:half}]],s:r.saldo});}
 closeModal(); const f=pendingAfter; pendingAfter=null; if(f) f(); else renderGame();
}

function importJSON(file){

  case "g-avg": applyAverage(); break;
  case "g-basket": PRODUCTS.filter(p=>p.basic).forEach(p=>G().cfg.cart[p.id]=(G().cfg.cart[p.id]||0)+1); renderGame(); break;
  case "g-cartclear": G().cfg.cart={}; renderGame(); break;
  case "g-cart": {const c=G().cfg.cart,id=el.dataset.id;c[id]=Math.max(0,(c[id]||0)+(+el.dataset.d));renderGame();} break;
  case "g-start": startGame(); break;

  case "s-pay": resolveSurprise("pay",+el.dataset.a,+el.dataset.i); break;
  case "s-cut": resolveSurprise("cut",+el.dataset.a,+el.dataset.i); break;
  case "s-split": resolveSurprise("split",+el.dataset.a,+el.dataset.i); break;

 }

  case "q-filter": Z.filter=el.value;Z.pos=0;renderQuiz(); break;
  case "q-teamcount": Z.teamCount=+el.value; Object.values(Z.ans).forEach(a=>{if(!a.done)a.choices=Array(teamsActive().length).fill(null)}); renderQuiz(); break;
  case "q-teamname": Z.teams[+el.dataset.i]=el.value.trim()||null; renderQuiz(); break;
  case "q-registro": Z.ans[filtered()[Z.pos].id].registro=el.value; break;
  case "g-salary": c.salaryId=el.value; {const s=SALARIES.find(x=>x.id===el.value); if(s){c.income=c.pagas==14?s.n14:s.n12; if(s.id==="dos"&&c.hogar==="solo")c.hogar="pareja";}} renderGame(); break;
  case "g-pagas": c.pagas=+el.value; {const s=SALARIES.find(x=>x.id===c.salaryId); if(s)c.income=c.pagas==14?s.n14:s.n12;} renderGame(); break;
  case "g-cfgsel": c[el.dataset.key]=el.dataset.num?+el.value:el.value;
   if(el.dataset.key==="hogar"){const h=HOUSEHOLDS[el.value];c.abonos=h.a;if(c.luzModo!=="manual"&&c.luzModo!=="ocu")c.luzModo=h.a+h.m>=4?"familia":h.a+h.m>=2?"pareja":"solo";}
   if(el.dataset.key==="syncCode"&&G().run){refreshGameRight();break;}
   renderGame(); break;
  case "g-num": c[el.dataset.key]=Math.max(0,+el.value||0); if(el.dataset.key==="income")c.salaryId="custom"; renderGame(); break;
 }
});
document.addEventListener("input",e=>{
 const el=e.target; if(!el.dataset.cfg) return;
 G().cfg[el.dataset.cfg]=+el.value; const v=$("#v_"+el.dataset.cfg); if(v) v.textContent=eur(+el.value);
 refreshGameRight();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modalRoot").innerHTML&&!$("#modalRoot .urgent")) closeModal();});

render();
</script>
</body>
</html>
