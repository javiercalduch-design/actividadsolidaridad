<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Interactivo de Desigualdad · Inequality Dashboard</title>
<style>
:root{
  --brand-primary:#1E40AF; --brand-secondary:#F59E0B; --brand-soft:#E8EEFB;
  --brand-text-on-primary:#FFFFFF; --brand-text-on-secondary:#0F172A;
  --ink:#0F172A; --muted:#475569; --line:#E2E8F0; --bg:#F8FAFC; --card:#FFFFFF;
  --ok:#15803D; --ok-bg:#DCFCE7; --warn:#B45309; --warn-bg:#FEF3C7; --bad:#B91C1C; --bad-bg:#FEE2E2;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand-secondary);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.topbar{position:sticky;top:0;z-index:40;background:var(--brand-primary);color:var(--brand-text-on-primary);box-shadow:0 2px 12px rgba(15,23,42,.18)}
.topbar-inner{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 280px}
.brand img{width:46px;height:46px;border-radius:10px;background:#fff;object-fit:contain;padding:3px}
.brand h1{font-size:1.05rem;margin:0;line-height:1.2}
.brand small{opacity:.85;display:block;font-size:.8rem}
.top-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.top-actions select{padding:7px 10px;border-radius:10px;border:0;max-width:230px;color:var(--ink)}
.tbtn{background:rgba(255,255,255,.16);color:inherit;border:1px solid rgba(255,255,255,.35);padding:7px 12px;border-radius:10px;font-weight:600;font-size:.9rem}
.tbtn:hover{background:rgba(255,255,255,.28)}
.tabs{max-width:1280px;margin:0 auto;display:flex;gap:4px;padding:0 16px;overflow-x:auto}
.tab{background:transparent;border:0;color:inherit;opacity:.8;padding:10px 14px;font-weight:700;border-bottom:4px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{opacity:1;border-bottom-color:var(--brand-secondary)}
main{max-width:1280px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.card h2{margin:0 0 6px;font-size:1.25rem}
.card h3{margin:0 0 8px;font-size:1.05rem}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:18px}
.stack{display:flex;flex-direction:column;gap:14px}
@media (max-width:920px){.grid2{grid-template-columns:1fr}}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;background:var(--brand-primary);color:var(--brand-text-on-primary)}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sec{background:var(--brand-secondary);color:var(--brand-text-on-secondary)}
.btn.ghost{background:var(--brand-soft);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:6px 10px;font-size:.86rem}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--brand-soft);color:var(--ink);border:1px solid var(--line)}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem}
label.f select,label.f input[type=number],label.f input[type=text]{padding:8px 10px;border:1px solid #CBD5E1;border-radius:10px;background:#fff;font-weight:500}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
input[type=range]{width:100%;accent-color:var(--brand-primary)}
.slider{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.slider .lbl{font-size:.88rem;font-weight:600}
.slider .val{font-variant-numeric:tabular-nums;font-weight:800;font-size:.9rem}
.slider input{grid-column:1/3}
.alert{border-radius:12px;padding:10px 12px;font-size:.9rem;border:1px solid}
.alert.ok{background:var(--ok-bg);border-color:#86EFAC;color:#14532D}
.alert.warn{background:var(--warn-bg);border-color:#FCD34D;color:#78350F}
.alert.bad{background:var(--bad-bg);border-color:#FCA5A5;color:#7F1D1D}
.alert.info{background:var(--brand-soft);border-color:var(--line)}
details.sec{border:1px solid var(--line);border-radius:12px;background:#fff}
details.sec>summary{cursor:pointer;padding:12px 14px;font-weight:800;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.sec>summary::after{content:"▾";transition:transform .2s}
details.sec[open]>summary::after{transform:rotate(180deg)}
details.sec>.in{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.progress{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.progress>span{display:block;height:100%;background:var(--brand-primary);transition:width .3s}
.qnav{display:flex;flex-wrap:wrap;gap:6px}
.qdot{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:.85rem}
.qdot.right{background:var(--ok-bg);border-color:#86EFAC}
.qdot.wrong{background:var(--bad-bg);border-color:#FCA5A5}
.qdot.cur{outline:3px solid var(--brand-primary);outline-offset:1px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--brand-primary)}
.opt.sel{border-color:var(--brand-primary);background:var(--brand-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt .letter{flex:0 0 28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--brand-primary);color:var(--brand-text-on-primary);font-weight:800}
.lockbox{border:2px dashed #CBD5E1;border-radius:12px;padding:16px;text-align:center;color:var(--muted);background:repeating-linear-gradient(45deg,#F8FAFC,#F8FAFC 10px,#F1F5F9 10px,#F1F5F9 20px)}
.reveal{border:2px solid var(--brand-primary);border-radius:12px;overflow:hidden}
.reveal>button{width:100%;text-align:left;padding:12px 14px;border:0;background:var(--brand-primary);color:var(--brand-text-on-primary);font-weight:800;display:flex;justify-content:space-between}
.reveal .body{padding:14px;background:#fff}
.reveal .big{font-size:1.6rem;font-weight:900;color:var(--brand-primary)}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.teambox{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}
.empathy{background:var(--brand-soft);border-left:5px solid var(--brand-secondary);padding:12px;border-radius:10px}
.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:1.3rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border-radius:12px;padding:12px;background:#fff;border:1px solid var(--line)}
.kpi .k{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.kpi .v{font-size:1.45rem;font-weight:900;font-variant-numeric:tabular-nums}
.kpi.neg .v{color:var(--bad)}
.kpi.pos .v{color:var(--ok)}
.meter{height:16px;border-radius:999px;background:var(--line);overflow:hidden;position:relative}
.meter>span{display:block;height:100%;transition:width .3s}
.meter .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:150px 1fr 82px;gap:8px;align-items:center;font-size:.83rem}
.bar .track{height:16px;background:#F1F5F9;border-radius:6px;position:relative;overflow:hidden}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--brand-primary);border-radius:6px}
.bar .ref{position:absolute;top:0;bottom:0;border-right:3px dotted var(--brand-secondary)}
.bar .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
@media (max-width:520px){.bar{grid-template-columns:105px 1fr 70px}}
.cart{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.prod{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:#fff;font-size:.86rem}
.prod .q{display:flex;align-items:center;gap:4px}
.prod .q button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--brand-soft);font-weight:800}
.prod .q span{min-width:20px;text-align:center;font-weight:800}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hist li{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;font-size:.86rem}
.weeks{display:flex;gap:6px}
.weeks span{flex:1;text-align:center;padding:6px 0;border-radius:8px;background:var(--line);font-weight:800;font-size:.8rem}
.weeks span.done{background:var(--brand-primary);color:var(--brand-text-on-primary)}
.weeks span.now{background:var(--brand-secondary);color:var(--brand-text-on-secondary)}
.banner{border-radius:14px;padding:16px;font-weight:800;text-align:center;font-size:1.1rem}
.banner.win{background:var(--ok-bg);color:#14532D;border:2px solid var(--ok)}
.banner.lose{background:var(--bad-bg);color:#7F1D1D;border:2px solid var(--bad)}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.urgent{border:4px solid var(--bad);animation:shake .5s ease 2}
.modal h2{margin-top:0}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.siren{display:inline-block;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.choice{display:block;width:100%;text-align:left;border:2px solid var(--line);border-radius:12px;padding:12px;background:#fff;margin-top:8px}
.choice:hover:not(:disabled){border-color:var(--brand-primary);background:var(--brand-soft)}
.choice:disabled{opacity:.5;cursor:not-allowed}
.swatch{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);display:inline-block;vertical-align:middle}
.logo-prev{width:90px;height:90px;border-radius:14px;border:1px solid var(--line);object-fit:contain;background:#fff;padding:4px}
.ent{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.ent .card{border-top:5px solid var(--brand-primary)}
table.src{width:100%;border-collapse:collapse;font-size:.84rem}
table.src td,table.src th{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
footer{max-width:1280px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:.8rem}
</style>
</head>

q:[
 {tag:"Pobreza y exclusión · Tasa AROPE",q:"¿Qué porcentaje de la población residente en España se encuentra en riesgo de pobreza o exclusión social (tasa AROPE) según los últimos datos definitivos del INE?",o:["11,4%","18,2%","25,7%","38,5%"],key:"25,7%",
  r:"El 25,7% de la población residente en España (alrededor de 12,6 millones de personas) estaba en riesgo de pobreza o exclusión social en 2025 según la Encuesta de Condiciones de Vida del INE (publicada en febrero de 2026 con datos de renta de 2024) y el XVI Informe de EAPN. Este indicador integra tres dimensiones: el 19,5% vive bajo el umbral de pobreza monetaria (menos de 12.220 € anuales por unidad de consumo, unos 1.018 €/mes), el 8,1% sufre carencia material y social severa (cerca de cuatro millones de personas) y el 8,0% reside en hogares con baja intensidad en el empleo.",
  s:"INE (ECV 2025, pub. feb. 2026) y EAPN XVI Informe (2026)",e:"Si 1 de cada 4 personas está en esta situación, ¿qué cosas cotidianas creéis que dejan de hacer esas familias sin que se note desde fuera?"},
 {tag:"Vulnerabilidad financiera · Imprevistos",q:"¿Qué porcentaje de la población en España NO tuvo capacidad económica para afrontar gastos imprevistos en 2025?",o:["14,5%","22,0%","36,4%","54,1%"],key:"36,4%",
  r:"Según la ECV 2025 del INE (publicada en febrero de 2026), el 36,4% de la población no pudo afrontar gastos imprevistos (frente al 35,8% de 2024). Además, según EAPN (2026), el 46,0% llega con algún grado de dificultad a fin de mes, un 8,5% llega con «mucha dificultad» (subiendo al 12,7% en Castilla-La Mancha, 12,1% en Región de Murcia y 11,5% en Canarias) y el 32,2% no puede permitirse al menos una semana de vacaciones fuera de casa al año.",
  s:"INE (ECV 2025, pub. feb. 2026) y EAPN XVI Informe (2026)",e:"Imaginad que se rompe la lavadora o hace falta ir al dentista: ¿cómo se sentiría alguien que sabe que no puede pagarlo?"},
 {tag:"Pobreza energética",q:"¿Qué porcentaje de la población en España no pudo mantener su vivienda a una temperatura adecuada en 2025?",o:["5,2%","15,9%","28,4%","41,0%"],key:"15,9%",
  r:"Aunque mejoró respecto al 20,7% de 2023 y el 17,6% de 2024, en 2025 el 15,9% de la población en España no pudo mantener una temperatura adecuada en su hogar (EAPN 2026 sobre ECV del INE), y la pobreza energética afecta al 13% de los niños y niñas según estimaciones difundidas por Oxfam Intermón. En octubre de 2026, además, la factura eléctrica media regulada (PVPC) alcanzó los 92,44 €/mes según la OCU, tras acumular un 28% de subida interanual.",
  s:"EAPN XVI (2026), Oxfam Intermón (prensa) y OCU (oct. 2026)",e:"¿Cómo afectaría a vuestro descanso, estudio o salud pasar el invierno en una casa fría?"},
 {tag:"Desigualdad de ingresos · S80/S20 y Gini",q:"En España, ¿cuántas veces más ingresos recibe el 20% más rico de la población frente al 20% más pobre (relación S80/S20)?",o:["2,1 veces más","3,4 veces más","5,2 veces más","9,8 veces más"],key:"5,2 veces",
  r:"El análisis de EAPN (Avance 2026 sobre la ECV 2025 del INE) sitúa la ratio S80/S20 en 5,2 veces más ingresos para el 20% más rico respecto al 20% más pobre, con un índice de Gini de 30,8. Aunque es el valor más bajo de la serie histórica estudiada, el IX Informe FOESSA (2025) advierte de que la desigualdad en España es estructural y que la clase media se contrae desplazando a muchas familias hacia la vulnerabilidad.",
  s:"EAPN Avance (2026) e IX Informe FOESSA (2025)",e:"Si en vuestro grupo una persona tuviera 5 veces más recursos que otra, ¿qué decisiones cambiarían para cada una?"},
 {tag:"Concentración de riqueza · Patrimonio",q:"¿Qué porcentaje de la riqueza nacional de España acaparaba el 10% más rico según el informe de Oxfam Intermón sobre datos de 2022?",o:["24,5%","38,0%","53,8%","76,2%"],key:"53,8%",
  r:"Según el informe «Desigualdad S.A., Filial en España» de Oxfam Intermón (con datos de 2022), el 10% más rico acaparaba el 53,8% de la riqueza nacional. Además, Oxfam señala que en 2025 la concentración de riqueza de los milmillonarios españoles siguió acelerándose y estima que el Impuesto sobre Patrimonio desaprovecha 8 de cada 10 euros potenciales por las debilidades y agujeros en su diseño.",
  s:"Oxfam Intermón (datos 2022 y notas 2025–2026)",e:"Repartid 10 caramelos en una clase de 10 personas: si 1 persona se queda más de la mitad, ¿cómo se sentiría el resto?"},
 {tag:"Desigualdad territorial · CCAA",q:"¿Cuánta diferencia bruta anual existe entre el salario medio de la comunidad que más paga (País Vasco) y el de la que menos paga (Extremadura)?",o:["Unos 2.800 € al año","Unos 5.400 € al año","Más de 10.100 € al año","Más de 18.000 € al año"],key:"10.190,84 €",
  r:"Según la Encuesta Anual de Estructura Salarial 2024 del INE (publicada en mayo de 2026), el salario medio bruto anual en País Vasco fue de 35.170,28 € frente a 24.979,44 € en Extremadura: 10.190,84 € de brecha anual (la Comunitat Valenciana se situó por debajo de la media estatal, con 26.816,98 €). En riesgo de pobreza o exclusión (AROPE 2025), destacan Melilla (43,7%), Ceuta (40,8%), Andalucía (34,7%), Castilla-La Mancha (34,0%) y Región de Murcia (32,5%).",
  s:"INE (EAES 2024, mayo 2026; ECV 2025) y Observatorio de la Pobreza",e:"¿Debería depender de dónde naces cuánto puedes llegar a ganar por el mismo trabajo? ¿Por qué?"},
 {tag:"Trampa estadística salarial · Media vs. moda",q:"El salario medio bruto en España es de 29.540 € al año, pero ¿cuál es el salario MÁS FRECUENTE (la moda, el sueldo que más se repite)?",o:["27.800 € brutos/año","24.497 € brutos/año","16.520 € brutos/año","12.100 € brutos/año"],key:"16.520,18 €",
  r:"Según la EAES 2024 del INE (publicada en mayo de 2026), los sueldos altos tiran hacia arriba de la media (29.540,26 € brutos/año), pero el salario mediano (la mitad cobra menos) es de 24.497,17 € y el más frecuente (moda) cae a 16.520,18 € brutos al año (1.180,01 € brutos en 14 pagas), muy cerca del Salario Mínimo Interprofesional (que en 2026 subió a 17.094 € brutos anuales, 1.221 € en 14 pagas).",
  s:"INE (EAES 2024, mayo 2026) y RD 126/2026",e:"Cuando oís «el sueldo medio es…» en las noticias, ¿a quién deja fuera ese dato?"},
 {tag:"Pobreza laboral · Trabajadores pobres",q:"Tener un empleo no garantiza salir de la pobreza. ¿Qué porcentaje aproximado de personas CON TRABAJO se encuentra en riesgo de pobreza en España (el tercer peor dato de la UE)?",o:["3,2%","6,5%","11,0%–11,6%","22,4%"],key:"11%–11,6%",
  r:"Según datos de Eurostat difundidos en noviembre de 2025 y cálculos de Oxfam Intermón, entre el 11% y el 11,6% de las personas trabajadoras en España está en riesgo de pobreza laboral, casi cinco puntos por encima de la media comunitaria (8,2%). El IX Informe FOESSA (2025) confirma que el empleo ha perdido su capacidad protectora: el 47,5% de la población activa (11,5 millones de personas) sufre precariedad laboral.",
  s:"Eurostat (nov. 2025), Oxfam Intermón y FOESSA (2025)",e:"¿Qué le diríais a alguien que trabaja todos los días y aun así no llega a fin de mes?"},
 {tag:"Brecha salarial de género",q:"¿Cuánto menos cobran de media al año las mujeres respecto a los hombres en España en ganancia bruta anual?",o:["Un 5% menos (unos 1.500 €)","Un 10% menos (unos 3.100 €)","Un 16% menos (más de 5.150 €)","Un 30% menos (unos 9.600 €)"],key:"5.152,65 € (~16%)",
  r:"La EAES 2024 definitiva del INE (mayo de 2026) registra una ganancia media anual de 32.057,55 € en hombres frente a 26.904,90 € en mujeres: 5.152,65 € menos al año (aproximadamente un 16% de brecha). Esta desigualdad está vinculada a una mayor presencia femenina en jornadas parciales, sectores peor pagados como hostelería o cuidados, y carreras interrumpidas por responsabilidades familiares.",
  s:"INE (EAES 2024, mayo 2026)",e:"¿Qué trabajos de cuidado se hacen en vuestras casas y quién los hace normalmente?"},
 {tag:"Brecha de cuidados y excedencias",q:"¿Qué porcentaje de las excedencias laborales para el cuidado de hijos o familiares en España son solicitadas por mujeres?",o:["52%","68%","87%","98%"],key:"87%",
  r:"Según datos de 2024 recogidos por Solidaridad Intergeneracional, las mujeres concentraron el 87% de las excedencias por cuidado. Asimismo, datos del Ministerio de Igualdad indican que el 40% de las madres ha tenido que dejar de trabajar para cuidar, frente al 26% de los padres, y el 42% de las personas encuestadas señala dificultades para conciliar empleo y cuidados.",
  s:"Solidaridad Intergeneracional (2024) y Ministerio de Igualdad",e:"Si alguien de vuestra familia tuviera que dejar de trabajar para cuidar, ¿cómo se decidiría quién lo hace?"},
 {tag:"Brecha de género en las pensiones",q:"Al acumular salarios más bajos e interrupciones por cuidados, ¿cuánto menos cobran de media las mujeres en su pensión respecto a los hombres en España?",o:["12,4% menos","21,0% menos","31,5% menos","48,2% menos"],key:"31,5%",
  r:"Las mujeres perciben de media un 31,5% menos en sus pensiones: a enero de 2025, la pensión media mensual masculina era de 1.564,53 € frente a 1.071,76 € en las mujeres (492,77 € menos cada mes). En la pensión mediana, la brecha española alcanzaba el 41,1% frente al 24,9% de la UE. Tras la sentencia del TJUE de mayo de 2025, el complemento de brecha de género en 2026 (36,90 €/mes por hijo en 14 pagas, hasta un máximo de 4 hijos) se reconoce en igualdad de condiciones a ambos progenitores.",
  s:"Público, Prevención Violencia (2025) y Grupo2000 (2026)",e:"Pensad en vuestras abuelas y abuelos: ¿qué trabajos hicieron que nunca se pagaron ni cotizaron?"},
 {tag:"Pobreza infantil y hogares monomarentales",q:"España presenta la tasa de pobreza infantil más alta de la Unión Europea según UNICEF España. ¿Qué porcentaje de niñas, niños y adolescentes vive en riesgo de pobreza o exclusión (AROPE) y cuánto alcanza la pobreza en hogares monomarentales?",o:["18% infantil y 25% en monomarentales","24% infantil y 33% en monomarentales","33,2% infantil y 45,8% en monomarentales","48% infantil y 65% en monomarentales"],key:"33,2% / 45,8%",
  r:"Según el análisis de Plataforma de Infancia sobre la ECV 2025 del INE (abril de 2026), el 33,2% de las niñas, niños y adolescentes (cerca de 2,6 millones) está en riesgo de pobreza o exclusión social. Save the Children (febrero de 2026) detalla que el 28,4% de los menores sufre pobreza monetaria (frente al 17,8% de mayores de 18 años) y un 12,5% (casi un millón) vive en pobreza severa. En hogares monomarentales la pobreza sube al 45,8%, más del doble que en familias con dos adultos (22,5%).",
  s:"Plataforma de Infancia, Save the Children (2026) y UNICEF (2025)",e:"¿Qué oportunidades (extraescolares, viajes, material) puede perder un niño o niña por la economía de su casa?"},
 {tag:"Emancipación juvenil",q:"¿A qué edad media se emancipan los jóvenes en España y qué porcentaje de jóvenes de 16 a 29 años ha logrado independizarse?",o:["26,3 años y un 34% emancipado","28,1 años y un 23% emancipado","30,2 años y solo un 14,5% emancipado","33,0 años y un 8% emancipado"],key:"30,2 años · 14,5%",
  r:"El Observatorio de Emancipación 2025 del Consejo de la Juventud de España (publicado en mayo de 2026) marcó un mínimo histórico: solo el 14,5% de los jóvenes de 16 a 29 años está emancipado, con una edad media de 30,2 años (casi 4 años por encima de la media de la UE de 26,3 años según Eurostat en septiembre de 2026, frente a los 21,3 años de Finlandia). El alquiler medio (1.176 €/mes) equivale al 98,7% del salario medio joven, disparando el riesgo de pobreza entre jóvenes inquilinos del 25,9% antes de pagar vivienda al 43% después de pagarla.",
  s:"CJE, Observatorio de Emancipación (mayo 2026) y Eurostat (sept. 2026)",e:"¿A qué edad os gustaría independizaros? ¿Qué necesitaríais para conseguirlo?"},
 {tag:"Vivienda como motor de pobreza",q:"La vivienda y sus suministros absorben un tercio (33,2%) del presupuesto del hogar medio español. En el 20% de los hogares con menor gasto (quintil 1), ¿qué porcentaje del presupuesto total se destina solo a vivienda/suministros y alimentación?",o:["38,0%","48,5%","61,5%","79,0%"],key:"61,5%",
  r:"La Encuesta de Presupuestos Familiares 2025 del INE (junio de 2026) muestra que mientras el hogar medio destina el 33,2% a vivienda/suministros y el 16,0% a alimentación (49,2% juntos), el 20% de hogares con menor gasto dedica el 61,5% de todo su presupuesto solo a pagar vivienda y energía (41,9%) más comida (19,6%). Asimismo, el IX Informe FOESSA (2025) señala que el 45% de las personas que viven de alquiler está en riesgo de pobreza.",
  s:"INE (EPF 2025, jun. 2026) y FOESSA (2025)",e:"Si casi dos tercios del dinero se van en casa y comida, ¿qué queda para todo lo demás? ¿Qué sacrificaríais primero?"},
 {tag:"Sinhogarismo y exclusión severa",q:"Entre 2022 y 2024, ¿cuánto aumentó la media diaria de personas sin hogar alojadas en centros de atención en España según el INE?",o:["Bajó un 5,2%","Subió un 12,0%","Subió un 57,5% (hasta 34.145 personas al día)","Subió un 120%"],key:"+57,5% · 34.145 personas/día",
  r:"La Encuesta de Centros y Servicios de Atención a las Personas Sin Hogar del INE (datos 2024, publicada en septiembre de 2025) registró un incremento del 57,5% respecto a 2022, hasta una media diaria de 34.145 personas adultas alojadas en centros asistenciales. En el conjunto de la sociedad, el IX Informe FOESSA (2025) estima que la exclusión social severa afecta ya a 4,3 millones de personas en España, un 52% más que en 2007.",
  s:"INE (Encuesta Sin Hogar 2024, sept. 2025) y FOESSA (2025)",e:"Cuando pasáis junto a una persona sin hogar, ¿qué creéis que necesitaría además de comida?"},
 {tag:"Origen nacional, racismo e infradenuncia",q:"La tasa AROPE entre personas de nacionalidad española es del 20,5%. ¿A cuánto sube entre personas extranjeras de fuera de la UE y qué porcentaje de los delitos de odio en España NO se denuncia?",o:["28% AROPE y 40% sin denunciar","39% AROPE y 65% sin denunciar","53,5% AROPE y 90% sin denunciar","72% AROPE y 99% sin denunciar"],key:"53,5% · 90%",
  r:"Según la ECV 2025 del INE, la tasa AROPE es del 20,5% para población española, 36,4% para extranjeros comunitarios y 53,5% para extranjeros del resto del mundo (2,6 veces superior). Sin embargo, FOESSA recuerda que el 69% de todas las personas en exclusión son españolas. Además, los delitos e incidentes de odio crecieron un 23,63% en 2025 hasta 2.417 hechos (38,64% por racismo/xenofobia, mientras 7 de cada 10 menores gitanos sufren exclusión severa según FSG/FOESSA), y el estudio de ONDOD y OBERAXE (2026) concluye que el 90% de los delitos de odio queda sin denunciar.",
  s:"INE (ECV 2025), ONDOD/OBERAXE (2025–2026) y FSG/FOESSA",e:"¿Por qué creéis que 9 de cada 10 víctimas de odio no denuncian? ¿Qué haría falta para que se sintieran seguras?"},
 {tag:"Desigualdad educativa y herencia intergeneracional",q:"El abandono educativo temprano en España bajó al 12,8% en 2025 (frente al 9,4% de la UE en 2024), pero ¿qué horquilla separa a la comunidad con menos abandono de la que tiene más, y cuánto multiplica el riesgo de exclusión severa no superar la ESO?",o:["Del 8% al 15% y multiplica el riesgo por 1,3","Del 3,8% (País Vasco) al 20,6% (Región de Murcia) y multiplica el riesgo por 2,7","Del 1% al 11% y multiplica el riesgo por 1,8","Del 10% al 35% y multiplica el riesgo por 5,0"],key:"3,8%–20,6% · ×2,7",
  r:"Funcas (datos 2025) sitúa el abandono temprano en el 12,8% nacional (15,9% en hombres frente a 9,5% en mujeres), mientras los datos regionales difundidos bajo metodología Eurostat-INE muestran brechas que van del 3,8% en País Vasco al 20,6% en la Región de Murcia. El IX Informe FOESSA (2025) concluye que los hijos de padres con bajo nivel educativo tienen más del doble de probabilidades de caer en pobreza y que no superar la ESO multiplica por 2,7 el riesgo de exclusión severa. A ello se suma un gasto medio de vuelta al cole de 2.484 € por hijo al año según la OCU (agosto de 2026).",
  s:"Funcas (2025), Eurostat-INE, IX Informe FOESSA (2025) y OCU (ago. 2026)",e:"¿Qué ayuda (en casa, en el centro, entre compañeros) hace que alguien no abandone los estudios?"},
 {tag:"Salud bucodental y salud mental",q:"¿Qué porcentaje de la población española declara tener necesidades dentales no cubiertas (casi el triple del 4,6% de la UE en Eurostat 2024) principalmente por resultar demasiado caro?",o:["4,8%","8,2%","12,0%","25,5%"],key:"12%",
  r:"Según datos europeos de Eurostat y análisis sectoriales de 2025–2026, el 12% de la población en España presenta necesidades bucodentales no cubiertas (frente al 4,6% en la UE), debido a la limitada cobertura pública y medianas privadas según encuesta OCU 2024 de 110 € por empaste, 250 € por endodoncia y 1.850 € por implante. En salud mental, informaciones de prensa nacional de 2021–2023 señalaban una dotación pública de 6 psicólogos clínicos por cada 100.000 habitantes frente a una media europea de 18.",
  s:"Eurostat (2024), OCU (2024) y prensa nacional (2021–2023)",e:"¿Os imagináis tener dolor de muelas semanas porque no hay dinero para el dentista? ¿Cómo afectaría a vuestro día a día?"},
 {tag:"Brecha digital e Inteligencia Artificial",q:"Aunque el 96,3% de la población de 16 a 74 años usó internet en 2025, ¿qué brecha separa a los niveles educativos más bajos frente a universitarios en el uso de Inteligencia Artificial generativa, y cuántos adolescentes de renta más baja carecen de recurso digital para estudiar?",o:["12 puntos de brecha en IA y 1 de cada 50 adolescentes","25 puntos en IA y 1 de cada 25 adolescentes","Más de 50 puntos en IA y 1 de cada 10 adolescentes vulnerables","85 puntos en IA y la mitad de los adolescentes"],key:">50 puntos · 1 de cada 10",
  r:"El Informe de Brecha Digital e IA de UGT sobre la encuesta TIC 2025 del INE identifica más de 50 puntos porcentuales de brecha en el uso de IA generativa entre los niveles educativos más bajos y universitarios (y 70 puntos entre 16–24 y 65–74 años). Además, un 6,2% de hogares españoles sigue sin conexión a internet y Plataforma de Infancia (febrero de 2025) alerta de que 1 de cada 10 adolescentes de 15 años del cuartil socioeconómico más bajo no dispone de un recurso digital adecuado para su formación en su entorno.",
  s:"UGT sobre Encuesta TIC 2025 del INE y Plataforma de Infancia (feb. 2025)",e:"¿Cómo haríais los deberes de esta semana sin ordenador ni buena conexión en casa?"},
 {tag:"Violencia digital y control de género en la juventud",q:"Según el Barómetro Juventud y Género 2025 (Fad Juventud y Delegación del Gobierno contra la Violencia de Género), ¿qué porcentaje de mujeres jóvenes declara que su pareja le ha revisado el móvil?",o:["7,5%","14,2%","27,3%","49,0%"],key:"27,3%",
  r:"En el Barómetro Juventud y Género 2025 (encuesta a 3.327 jóvenes de 15 a 29 años), el 27,3% de las mujeres jóvenes declaró que su pareja le ha revisado el móvil, y un estudio posterior de Fad Juventud (mayo de 2026) registró que el 57% de la juventud española sufrió alguna agresión digital en 2025. Estas dinámicas cotidianas de control digital coexisten con 106.549 casos activos de violencia machista en el sistema VioGén registrados en 2026.",
  s:"Barómetro Juventud y Género 2025 (Fad / DGVG), Fad Juventud (mayo 2026) y VioGén (2026)",e:"¿Dónde está la línea entre interesarse por tu pareja y controlarla? Poned ejemplos concretos."}
]

q:[
 {tag:"Poverty and exclusion · AROPE rate",q:"What percentage of Spain's resident population is at risk of poverty or social exclusion (AROPE rate) according to the latest final data from the INE (Spanish Statistics Office)?",o:["11.4%","18.2%","25.7%","38.5%"],key:"25.7%",
  r:"25.7% of Spain's resident population (around 12.6 million people) was at risk of poverty or social exclusion in 2025 according to the INE Living Conditions Survey (published in February 2026 with 2024 income data) and the 16th EAPN Report. The indicator combines three dimensions: 19.5% live below the monetary poverty line (less than €12,220 a year per consumption unit, about €1,018/month), 8.1% suffer severe material and social deprivation (nearly four million people) and 8.0% live in households with low work intensity.",
  s:"INE (Living Conditions Survey 2025, pub. Feb 2026) and 16th EAPN Report (2026)",e:"If 1 in 4 people are in this situation, what everyday things do you think these families stop doing without anyone noticing from outside?"},
 {tag:"Financial vulnerability · Unexpected expenses",q:"What percentage of the population in Spain could NOT afford to face unexpected expenses in 2025?",o:["14.5%","22.0%","36.4%","54.1%"],key:"36.4%",
  r:"According to the INE Living Conditions Survey 2025 (published in February 2026), 36.4% of the population could not face unexpected expenses (compared with 35.8% in 2024). In addition, according to EAPN (2026), 46.0% have some difficulty making ends meet, 8.5% have “great difficulty” (rising to 12.7% in Castilla-La Mancha, 12.1% in the Region of Murcia and 11.5% in the Canary Islands) and 32.2% cannot afford at least one week's holiday away from home a year.",
  s:"INE (Living Conditions Survey 2025, pub. Feb 2026) and 16th EAPN Report (2026)",e:"Imagine the washing machine breaks or someone needs a dentist: how would a person feel knowing they cannot pay for it?"},
 {tag:"Energy poverty",q:"What percentage of the population in Spain could not keep their home adequately warm in 2025?",o:["5.2%","15.9%","28.4%","41.0%"],key:"15.9%",
  r:"Although it improved from 20.7% in 2023 and 17.6% in 2024, in 2025 15.9% of the population in Spain could not keep their home at an adequate temperature (EAPN 2026 based on the INE survey), and energy poverty affects 13% of children according to estimates published by Oxfam Intermón. In October 2026, the average regulated electricity bill (PVPC) also reached €92.44/month according to OCU, after a 28% year-on-year rise.",
  s:"16th EAPN Report (2026), Oxfam Intermón (press) and OCU (Oct 2026)",e:"How would spending the winter in a cold home affect your sleep, studies or health?"},
 {tag:"Income inequality · S80/S20 and Gini",q:"In Spain, how many times more income does the richest 20% of the population receive compared with the poorest 20% (S80/S20 ratio)?",o:["2.1 times more","3.4 times more","5.2 times more","9.8 times more"],key:"5.2 times",
  r:"EAPN's analysis (2026 preview on the INE Living Conditions Survey 2025) puts the S80/S20 ratio at 5.2 times more income for the richest 20% than for the poorest 20%, with a Gini index of 30.8. Although this is the lowest value in the historical series studied, the 9th FOESSA Report (2025) warns that inequality in Spain is structural and that the middle class is shrinking, pushing many families into vulnerability.",
  s:"EAPN Preview (2026) and 9th FOESSA Report (2025)",e:"If one person in your group had 5 times more resources than another, which decisions would change for each of them?"},
 {tag:"Concentration of wealth · Assets",q:"What percentage of Spain's national wealth was held by the richest 10% according to the Oxfam Intermón report on 2022 data?",o:["24.5%","38.0%","53.8%","76.2%"],key:"53.8%",
  r:"According to Oxfam Intermón's report “Inequality Inc., Spanish branch” (with 2022 data), the richest 10% held 53.8% of national wealth. Oxfam also notes that in 2025 the concentration of wealth among Spanish billionaires kept accelerating and estimates that the Wealth Tax misses 8 out of every 10 potential euros because of weaknesses and loopholes in its design.",
  s:"Oxfam Intermón (2022 data and 2025–2026 notes)",e:"Share 10 sweets in a class of 10 people: if 1 person keeps more than half, how would the others feel?"},
 {tag:"Territorial inequality · Regions",q:"What is the gross annual difference between the average salary in the highest-paying region (Basque Country) and the lowest-paying one (Extremadura)?",o:["About €2,800 a year","About €5,400 a year","More than €10,100 a year","More than €18,000 a year"],key:"€10,190.84",
  r:"According to the INE Annual Wage Structure Survey 2024 (published in May 2026), the average gross annual salary in the Basque Country was €35,170.28 compared with €24,979.44 in Extremadura: an annual gap of €10,190.84 (the Valencian Community was below the national average, at €26,816.98). In terms of risk of poverty or exclusion (AROPE 2025), Melilla (43.7%), Ceuta (40.8%), Andalusia (34.7%), Castilla-La Mancha (34.0%) and the Region of Murcia (32.5%) stand out.",
  s:"INE (EAES 2024, May 2026; Living Conditions Survey 2025) and Poverty Observatory",e:"Should where you are born decide how much you can earn for the same job? Why?"},
 {tag:"Salary statistics trap · Mean vs. mode",q:"The average gross salary in Spain is €29,540 a year, but what is the MOST COMMON salary (the mode, the wage that appears most often)?",o:["€27,800 gross/year","€24,497 gross/year","€16,520 gross/year","€12,100 gross/year"],key:"€16,520.18",
  r:"According to the INE EAES 2024 (published in May 2026), high salaries pull the average up (€29,540.26 gross/year), but the median salary (half earn less) is €24,497.17 and the most common salary (mode) drops to €16,520.18 gross a year (€1,180.01 gross in 14 payments), very close to the national minimum wage (which rose in 2026 to €17,094 gross a year, €1,221 in 14 payments).",
  s:"INE (EAES 2024, May 2026) and Royal Decree 126/2026",e:"When you hear “the average salary is…” on the news, who does that figure leave out?"},
 {tag:"In-work poverty · Working poor",q:"Having a job does not guarantee escaping poverty. Roughly what percentage of people WITH A JOB are at risk of poverty in Spain (the third-worst figure in the EU)?",o:["3.2%","6.5%","11.0%–11.6%","22.4%"],key:"11%–11.6%",
  r:"According to Eurostat data published in November 2025 and Oxfam Intermón calculations, between 11% and 11.6% of workers in Spain are at risk of in-work poverty, almost five points above the EU average (8.2%). The 9th FOESSA Report (2025) confirms that employment has lost its protective capacity: 47.5% of the active population (11.5 million people) suffer job insecurity.",
  s:"Eurostat (Nov 2025), Oxfam Intermón and FOESSA (2025)",e:"What would you say to someone who works every day and still cannot make ends meet?"},
 {tag:"Gender pay gap",q:"How much less do women earn on average per year than men in Spain in gross annual earnings?",o:["5% less (about €1,500)","10% less (about €3,100)","16% less (over €5,150)","30% less (about €9,600)"],key:"€5,152.65 (~16%)",
  r:"The final INE EAES 2024 (May 2026) records average annual earnings of €32,057.55 for men compared with €26,904.90 for women: €5,152.65 less a year (a gap of about 16%). This inequality is linked to the greater presence of women in part-time work, lower-paid sectors such as hospitality or care, and careers interrupted by family responsibilities.",
  s:"INE (EAES 2024, May 2026)",e:"What care work is done in your homes, and who usually does it?"},
 {tag:"Care gap and leave",q:"What percentage of unpaid leave to care for children or relatives in Spain is requested by women?",o:["52%","68%","87%","98%"],key:"87%",
  r:"According to 2024 data compiled by Solidaridad Intergeneracional, women accounted for 87% of care leave. Data from the Ministry of Equality also show that 40% of mothers have had to stop working to provide care, compared with 26% of fathers, and 42% of respondents report difficulties balancing work and care.",
  s:"Solidaridad Intergeneracional (2024) and Ministry of Equality",e:"If someone in your family had to stop working to care for someone, how would you decide who does it?"},
 {tag:"Gender pension gap",q:"After accumulating lower salaries and career breaks for caring, how much less do women receive on average in their pension than men in Spain?",o:["12.4% less","21.0% less","31.5% less","48.2% less"],key:"31.5%",
  r:"Women receive on average 31.5% less in their pensions: in January 2025 the average monthly pension for men was €1,564.53 compared with €1,071.76 for women (€492.77 less each month). For the median pension, the Spanish gap reached 41.1% compared with 24.9% in the EU. Following the CJEU ruling of May 2025, the 2026 gender-gap supplement (€36.90/month per child in 14 payments, up to 4 children) is granted on equal terms to both parents.",
  s:"Público, Prevención Violencia (2025) and Grupo2000 (2026)",e:"Think about your grandmothers and grandfathers: what work did they do that was never paid or counted towards a pension?"},
 {tag:"Child poverty and single-mother households",q:"Spain has the highest child poverty rate in the European Union according to UNICEF Spain. What percentage of children and adolescents are at risk of poverty or exclusion (AROPE), and how high is poverty in single-mother households?",o:["18% of children and 25% in single-mother homes","24% of children and 33% in single-mother homes","33.2% of children and 45.8% in single-mother homes","48% of children and 65% in single-mother homes"],key:"33.2% / 45.8%",
  r:"According to Plataforma de Infancia's analysis of the INE Living Conditions Survey 2025 (April 2026), 33.2% of children and adolescents (about 2.6 million) are at risk of poverty or social exclusion. Save the Children (February 2026) specifies that 28.4% of minors suffer monetary poverty (compared with 17.8% of over-18s) and 12.5% (almost one million) live in severe poverty. In single-mother households poverty rises to 45.8%, more than double that of two-adult families (22.5%).",
  s:"Plataforma de Infancia, Save the Children (2026) and UNICEF (2025)",e:"What opportunities (after-school activities, trips, materials) can a child miss out on because of their family's finances?"},
 {tag:"Youth emancipation",q:"At what average age do young people leave home in Spain, and what percentage of 16- to 29-year-olds have managed to live independently?",o:["26.3 years and 34% independent","28.1 years and 23% independent","30.2 years and only 14.5% independent","33.0 years and 8% independent"],key:"30.2 years · 14.5%",
  r:"The 2025 Emancipation Observatory of the Spanish Youth Council (published in May 2026) hit a record low: only 14.5% of 16- to 29-year-olds live independently, with an average leaving-home age of 30.2 (almost 4 years above the EU average of 26.3 according to Eurostat in September 2026, compared with 21.3 in Finland). The average rent (€1,176/month) equals 98.7% of the average young person's salary, raising the poverty risk among young tenants from 25.9% before paying for housing to 43% after paying for it.",
  s:"Spanish Youth Council, Emancipation Observatory (May 2026) and Eurostat (Sept 2026)",e:"At what age would you like to live independently? What would you need to make it happen?"},
 {tag:"Housing as a driver of poverty",q:"Housing and utilities take a third (33.2%) of the average Spanish household budget. Among the 20% of households with the lowest spending (quintile 1), what percentage of the total budget goes on housing/utilities and food alone?",o:["38.0%","48.5%","61.5%","79.0%"],key:"61.5%",
  r:"The INE Household Budget Survey 2025 (June 2026) shows that while the average household spends 33.2% on housing/utilities and 16.0% on food (49.2% together), the 20% of households with the lowest spending devote 61.5% of their whole budget just to housing and energy (41.9%) plus food (19.6%). The 9th FOESSA Report (2025) also notes that 45% of people who rent are at risk of poverty.",
  s:"INE (Household Budget Survey 2025, June 2026) and FOESSA (2025)",e:"If almost two thirds of the money goes on the home and food, what is left for everything else? What would you give up first?"},
 {tag:"Homelessness and severe exclusion",q:"Between 2022 and 2024, by how much did the daily average of homeless people staying in support centres in Spain increase according to the INE?",o:["It fell by 5.2%","It rose by 12.0%","It rose by 57.5% (to 34,145 people a day)","It rose by 120%"],key:"+57.5% · 34,145 people/day",
  r:"The INE Survey of Centres and Services for Homeless People (2024 data, published in September 2025) recorded a 57.5% increase compared with 2022, reaching a daily average of 34,145 adults staying in support centres. Across society, the 9th FOESSA Report (2025) estimates that severe social exclusion now affects 4.3 million people in Spain, 52% more than in 2007.",
  s:"INE (Homelessness Survey 2024, Sept 2025) and FOESSA (2025)",e:"When you walk past a homeless person, what do you think they would need apart from food?"},
 {tag:"National origin, racism and under-reporting",q:"The AROPE rate among Spanish nationals is 20.5%. How high does it rise among non-EU foreign nationals, and what percentage of hate crimes in Spain go UNREPORTED?",o:["28% AROPE and 40% unreported","39% AROPE and 65% unreported","53.5% AROPE and 90% unreported","72% AROPE and 99% unreported"],key:"53.5% · 90%",
  r:"According to the INE Living Conditions Survey 2025, the AROPE rate is 20.5% for Spanish nationals, 36.4% for EU foreign nationals and 53.5% for foreign nationals from the rest of the world (2.6 times higher). However, FOESSA points out that 69% of all people in exclusion are Spanish. In addition, hate crimes and incidents rose by 23.63% in 2025 to 2,417 cases (38.64% for racism/xenophobia, while 7 out of 10 Roma children suffer severe exclusion according to FSG/FOESSA), and the ONDOD and OBERAXE study (2026) concludes that 90% of hate crimes go unreported.",
  s:"INE (Living Conditions Survey 2025), ONDOD/OBERAXE (2025–2026) and FSG/FOESSA",e:"Why do you think 9 out of 10 victims of hate do not report it? What would they need to feel safe?"},
 {tag:"Educational inequality and intergenerational inheritance",q:"Early school leaving in Spain fell to 12.8% in 2025 (compared with 9.4% in the EU in 2024), but what range separates the region with the least early leaving from the one with the most, and by how much does not completing compulsory secondary education (ESO) multiply the risk of severe exclusion?",o:["From 8% to 15%, multiplying the risk by 1.3","From 3.8% (Basque Country) to 20.6% (Region of Murcia), multiplying the risk by 2.7","From 1% to 11%, multiplying the risk by 1.8","From 10% to 35%, multiplying the risk by 5.0"],key:"3.8%–20.6% · ×2.7",
  r:"Funcas (2025 data) puts early school leaving at 12.8% nationally (15.9% for boys versus 9.5% for girls), while regional data published using the Eurostat-INE methodology show gaps ranging from 3.8% in the Basque Country to 20.6% in the Region of Murcia. The 9th FOESSA Report (2025) concludes that children of parents with a low level of education are more than twice as likely to fall into poverty and that not completing ESO multiplies the risk of severe exclusion by 2.7. On top of this, average back-to-school spending is €2,484 per child a year according to OCU (August 2026).",
  s:"Funcas (2025), Eurostat-INE, 9th FOESSA Report (2025) and OCU (Aug 2026)",e:"What kind of help (at home, at school, from classmates) keeps someone from dropping out?"},
 {tag:"Dental and mental health",q:"What percentage of the Spanish population reports unmet dental care needs (almost three times the EU's 4.6% in Eurostat 2024), mainly because it is too expensive?",o:["4.8%","8.2%","12.0%","25.5%"],key:"12%",
  r:"According to Eurostat data and sector analyses from 2025–2026, 12% of the population in Spain has unmet dental needs (compared with 4.6% in the EU), due to limited public coverage and private median prices, according to a 2024 OCU survey, of €110 for a filling, €250 for a root canal and €1,850 for an implant. On mental health, national press reports from 2021–2023 pointed to public provision of 6 clinical psychologists per 100,000 inhabitants compared with a European average of 18.",
  s:"Eurostat (2024), OCU (2024) and national press (2021–2023)",e:"Can you imagine having toothache for weeks because there's no money for the dentist? How would it affect your daily life?"},
 {tag:"Digital divide and Artificial Intelligence",q:"Although 96.3% of people aged 16 to 74 used the internet in 2025, what gap separates those with the lowest education levels from university graduates in the use of generative AI, and how many lower-income teenagers lack a digital device for studying?",o:["A 12-point AI gap and 1 in 50 teenagers","25 points in AI and 1 in 25 teenagers","More than 50 points in AI and 1 in 10 vulnerable teenagers","85 points in AI and half of all teenagers"],key:">50 points · 1 in 10",
  r:"UGT's Digital Divide and AI Report on the INE ICT survey 2025 identifies a gap of more than 50 percentage points in the use of generative AI between the lowest education levels and university graduates (and 70 points between 16–24 and 65–74 year olds). In addition, 6.2% of Spanish households still have no internet connection, and Plataforma de Infancia (February 2025) warns that 1 in 10 15-year-olds in the lowest socio-economic quartile does not have an adequate digital device for learning at home.",
  s:"UGT on the INE ICT Survey 2025 and Plataforma de Infancia (Feb 2025)",e:"How would you do this week's homework without a computer or a good connection at home?"},
 {tag:"Digital violence and gender control among young people",q:"According to the 2025 Youth and Gender Barometer (Fad Juventud and the Government Delegation against Gender Violence), what percentage of young women say their partner has checked their phone?",o:["7.5%","14.2%","27.3%","49.0%"],key:"27.3%",
  r:"In the 2025 Youth and Gender Barometer (a survey of 3,327 young people aged 15 to 29), 27.3% of young women said their partner had checked their phone, and a later Fad Juventud study (May 2026) found that 57% of young people in Spain suffered some form of digital aggression in 2025. These everyday dynamics of digital control coexist with 106,549 active cases of gender-based violence recorded in the VioGén system in 2026.",
  s:"Youth and Gender Barometer 2025 (Fad / DGVG), Fad Juventud (May 2026) and VioGén (2026)",e:"Where is the line between caring about your partner and controlling them? Give concrete examples."}
]
};

q:[
 {tag:"Pauvreté et exclusion · Taux AROPE",q:"Quel pourcentage de la population résidant en Espagne est en risque de pauvreté ou d'exclusion sociale (taux AROPE) selon les dernières données définitives de l'INE (institut statistique espagnol) ?",o:["11,4 %","18,2 %","25,7 %","38,5 %"],key:"25,7 %",
  r:"25,7 % de la population résidant en Espagne (environ 12,6 millions de personnes) était en risque de pauvreté ou d'exclusion sociale en 2025 selon l'Enquête sur les conditions de vie de l'INE (publiée en février 2026 avec les revenus de 2024) et le XVIe rapport de l'EAPN. Cet indicateur combine trois dimensions : 19,5 % vivent sous le seuil de pauvreté monétaire (moins de 12 220 € par an par unité de consommation, environ 1 018 €/mois), 8,1 % subissent une privation matérielle et sociale sévère (près de quatre millions de personnes) et 8,0 % vivent dans des foyers à faible intensité de travail.",
  s:"INE (Enquête conditions de vie 2025, publ. fév. 2026) et XVIe rapport EAPN (2026)",e:"Si 1 personne sur 4 est dans cette situation, quelles choses du quotidien ces familles cessent-elles de faire sans que cela se voie de l'extérieur ?"},
 {tag:"Vulnérabilité financière · Imprévus",q:"Quel pourcentage de la population en Espagne n'avait PAS les moyens de faire face à des dépenses imprévues en 2025 ?",o:["14,5 %","22,0 %","36,4 %","54,1 %"],key:"36,4 %",
  r:"Selon l'Enquête sur les conditions de vie 2025 de l'INE (publiée en février 2026), 36,4 % de la population n'a pas pu faire face à des dépenses imprévues (contre 35,8 % en 2024). En outre, selon l'EAPN (2026), 46,0 % ont des difficultés à boucler le mois, 8,5 % avec « beaucoup de difficultés » (jusqu'à 12,7 % en Castille-La Manche, 12,1 % en Région de Murcie et 11,5 % aux Canaries) et 32,2 % ne peuvent pas s'offrir au moins une semaine de vacances hors de chez eux par an.",
  s:"INE (Enquête conditions de vie 2025, publ. fév. 2026) et XVIe rapport EAPN (2026)",e:"Imaginez que la machine à laver tombe en panne ou qu'il faille aller chez le dentiste : comment se sentirait quelqu'un qui sait qu'il ne peut pas payer ?"},
 {tag:"Précarité énergétique",q:"Quel pourcentage de la population en Espagne n'a pas pu maintenir son logement à une température adéquate en 2025 ?",o:["5,2 %","15,9 %","28,4 %","41,0 %"],key:"15,9 %",
  r:"Bien qu'en amélioration par rapport à 20,7 % en 2023 et 17,6 % en 2024, en 2025 15,9 % de la population en Espagne n'a pas pu maintenir une température adéquate chez elle (EAPN 2026 d'après l'enquête de l'INE), et la précarité énergétique touche 13 % des enfants selon des estimations diffusées par Oxfam Intermón. En octobre 2026, la facture moyenne d'électricité au tarif réglementé (PVPC) a en outre atteint 92,44 €/mois selon l'OCU, après une hausse de 28 % sur un an.",
  s:"XVIe rapport EAPN (2026), Oxfam Intermón (presse) et OCU (oct. 2026)",e:"Comment passer l'hiver dans une maison froide affecterait-il votre sommeil, vos études ou votre santé ?"},
 {tag:"Inégalités de revenus · S80/S20 et Gini",q:"En Espagne, combien de fois plus de revenus les 20 % les plus riches perçoivent-ils par rapport aux 20 % les plus pauvres (rapport S80/S20) ?",o:["2,1 fois plus","3,4 fois plus","5,2 fois plus","9,8 fois plus"],key:"5,2 fois",
  r:"L'analyse de l'EAPN (aperçu 2026 sur l'enquête 2025 de l'INE) situe le rapport S80/S20 à 5,2 fois plus de revenus pour les 20 % les plus riches que pour les 20 % les plus pauvres, avec un indice de Gini de 30,8. Bien qu'il s'agisse de la valeur la plus basse de la série historique étudiée, le IXe rapport FOESSA (2025) avertit que les inégalités en Espagne sont structurelles et que la classe moyenne se contracte, poussant de nombreuses familles vers la vulnérabilité.",
  s:"Aperçu EAPN (2026) et IXe rapport FOESSA (2025)",e:"Si dans votre groupe une personne avait 5 fois plus de ressources qu'une autre, quelles décisions changeraient pour chacune ?"},
 {tag:"Concentration du patrimoine",q:"Quel pourcentage de la richesse nationale de l'Espagne détenaient les 10 % les plus riches selon le rapport d'Oxfam Intermón sur les données de 2022 ?",o:["24,5 %","38,0 %","53,8 %","76,2 %"],key:"53,8 %",
  r:"Selon le rapport « Inégalités S.A., filiale en Espagne » d'Oxfam Intermón (données de 2022), les 10 % les plus riches détenaient 53,8 % de la richesse nationale. Oxfam souligne en outre qu'en 2025 la concentration du patrimoine des milliardaires espagnols a continué de s'accélérer et estime que l'impôt sur la fortune laisse échapper 8 euros potentiels sur 10 en raison des failles de sa conception.",
  s:"Oxfam Intermón (données 2022 et notes 2025–2026)",e:"Partagez 10 bonbons dans une classe de 10 personnes : si 1 personne en garde plus de la moitié, comment se sentiraient les autres ?"},
 {tag:"Inégalités territoriales · Régions",q:"Quel est l'écart brut annuel entre le salaire moyen de la région qui paie le plus (Pays basque) et celui de la région qui paie le moins (Estrémadure) ?",o:["Environ 2 800 € par an","Environ 5 400 € par an","Plus de 10 100 € par an","Plus de 18 000 € par an"],key:"10 190,84 €",
  r:"Selon l'Enquête annuelle sur la structure des salaires 2024 de l'INE (publiée en mai 2026), le salaire moyen brut annuel au Pays basque était de 35 170,28 € contre 24 979,44 € en Estrémadure : un écart annuel de 10 190,84 € (la Communauté valencienne se situait sous la moyenne nationale, à 26 816,98 €). En matière de risque de pauvreté ou d'exclusion (AROPE 2025), se distinguent Melilla (43,7 %), Ceuta (40,8 %), l'Andalousie (34,7 %), la Castille-La Manche (34,0 %) et la Région de Murcie (32,5 %).",
  s:"INE (EAES 2024, mai 2026 ; Enquête conditions de vie 2025) et Observatoire de la pauvreté",e:"Le lieu de naissance devrait-il déterminer combien on peut gagner pour le même travail ? Pourquoi ?"},
 {tag:"Piège statistique salarial · Moyenne vs mode",q:"Le salaire moyen brut en Espagne est de 29 540 € par an, mais quel est le salaire LE PLUS FRÉQUENT (le mode, le salaire qui revient le plus souvent) ?",o:["27 800 € bruts/an","24 497 € bruts/an","16 520 € bruts/an","12 100 € bruts/an"],key:"16 520,18 €",
  r:"Selon l'EAES 2024 de l'INE (publiée en mai 2026), les hauts salaires tirent la moyenne vers le haut (29 540,26 € bruts/an), mais le salaire médian (la moitié gagne moins) est de 24 497,17 € et le plus fréquent (mode) tombe à 16 520,18 € bruts par an (1 180,01 € bruts sur 14 versements), très proche du salaire minimum interprofessionnel (porté en 2026 à 17 094 € bruts par an, 1 221 € sur 14 versements).",
  s:"INE (EAES 2024, mai 2026) et décret royal 126/2026",e:"Quand vous entendez « le salaire moyen est de… » aux informations, qui ce chiffre laisse-t-il de côté ?"},
 {tag:"Pauvreté laborieuse · Travailleurs pauvres",q:"Avoir un emploi ne garantit pas de sortir de la pauvreté. Quel pourcentage approximatif de personnes AYANT UN EMPLOI est en risque de pauvreté en Espagne (le troisième pire chiffre de l'UE) ?",o:["3,2 %","6,5 %","11,0 %–11,6 %","22,4 %"],key:"11 %–11,6 %",
  r:"Selon des données d'Eurostat publiées en novembre 2025 et des calculs d'Oxfam Intermón, entre 11 % et 11,6 % des travailleurs en Espagne sont en risque de pauvreté laborieuse, près de cinq points au-dessus de la moyenne européenne (8,2 %). Le IXe rapport FOESSA (2025) confirme que l'emploi a perdu sa capacité protectrice : 47,5 % de la population active (11,5 millions de personnes) subit la précarité professionnelle.",
  s:"Eurostat (nov. 2025), Oxfam Intermón et FOESSA (2025)",e:"Que diriez-vous à quelqu'un qui travaille tous les jours et n'arrive pourtant pas à boucler le mois ?"},
 {tag:"Écart salarial femmes-hommes",q:"Combien les femmes gagnent-elles de moins en moyenne par an que les hommes en Espagne en rémunération brute annuelle ?",o:["5 % de moins (environ 1 500 €)","10 % de moins (environ 3 100 €)","16 % de moins (plus de 5 150 €)","30 % de moins (environ 9 600 €)"],key:"5 152,65 € (~16 %)",
  r:"L'EAES 2024 définitive de l'INE (mai 2026) enregistre une rémunération moyenne annuelle de 32 057,55 € pour les hommes contre 26 904,90 € pour les femmes : 5 152,65 € de moins par an (un écart d'environ 16 %). Cette inégalité est liée à la plus forte présence des femmes dans le temps partiel, dans des secteurs moins bien payés comme l'hôtellerie-restauration ou le soin, et à des carrières interrompues par les responsabilités familiales.",
  s:"INE (EAES 2024, mai 2026)",e:"Quelles tâches de soin sont faites chez vous, et qui les fait habituellement ?"},
 {tag:"Écart dans le soin et congés",q:"Quel pourcentage des congés pour s'occuper d'enfants ou de proches en Espagne est demandé par des femmes ?",o:["52 %","68 %","87 %","98 %"],key:"87 %",
  r:"Selon des données de 2024 recueillies par Solidaridad Intergeneracional, les femmes ont concentré 87 % des congés pour soins. De même, des données du ministère de l'Égalité indiquent que 40 % des mères ont dû cesser de travailler pour s'occuper d'un proche, contre 26 % des pères, et 42 % des personnes interrogées signalent des difficultés à concilier emploi et soins.",
  s:"Solidaridad Intergeneracional (2024) et ministère de l'Égalité",e:"Si quelqu'un de votre famille devait arrêter de travailler pour s'occuper d'un proche, comment déciderait-on qui le fait ?"},
 {tag:"Écart de pension femmes-hommes",q:"En cumulant des salaires plus bas et des interruptions pour soins, combien les femmes touchent-elles de moins en moyenne de pension que les hommes en Espagne ?",o:["12,4 % de moins","21,0 % de moins","31,5 % de moins","48,2 % de moins"],key:"31,5 %",
  r:"Les femmes perçoivent en moyenne 31,5 % de moins de pension : en janvier 2025, la pension moyenne mensuelle des hommes était de 1 564,53 € contre 1 071,76 € pour les femmes (492,77 € de moins chaque mois). Pour la pension médiane, l'écart espagnol atteignait 41,1 % contre 24,9 % dans l'UE. Après l'arrêt de la CJUE de mai 2025, le complément pour écart de genre en 2026 (36,90 €/mois par enfant sur 14 versements, jusqu'à 4 enfants) est accordé dans les mêmes conditions aux deux parents.",
  s:"Público, Prevención Violencia (2025) et Grupo2000 (2026)",e:"Pensez à vos grands-mères et grands-pères : quels travaux ont-ils faits qui n'ont jamais été payés ni cotisés ?"},
 {tag:"Pauvreté infantile et familles monoparentales",q:"L'Espagne a le taux de pauvreté infantile le plus élevé de l'Union européenne selon l'UNICEF Espagne. Quel pourcentage d'enfants et d'adolescents est en risque de pauvreté ou d'exclusion (AROPE), et quel niveau atteint la pauvreté dans les familles monoparentales dirigées par une mère ?",o:["18 % des enfants et 25 % en monoparental","24 % des enfants et 33 % en monoparental","33,2 % des enfants et 45,8 % en monoparental","48 % des enfants et 65 % en monoparental"],key:"33,2 % / 45,8 %",
  r:"Selon l'analyse de la Plataforma de Infancia sur l'enquête 2025 de l'INE (avril 2026), 33,2 % des enfants et adolescents (environ 2,6 millions) sont en risque de pauvreté ou d'exclusion sociale. Save the Children (février 2026) précise que 28,4 % des mineurs connaissent la pauvreté monétaire (contre 17,8 % des plus de 18 ans) et que 12,5 % (près d'un million) vivent dans la pauvreté sévère. Dans les familles monoparentales dirigées par une mère, la pauvreté monte à 45,8 %, plus du double de celle des familles à deux adultes (22,5 %).",
  s:"Plataforma de Infancia, Save the Children (2026) et UNICEF (2025)",e:"Quelles opportunités (activités extrascolaires, voyages, matériel) un enfant peut-il perdre à cause des finances de sa famille ?"},
 {tag:"Émancipation des jeunes",q:"À quel âge moyen les jeunes quittent-ils le foyer familial en Espagne et quel pourcentage des 16–29 ans a réussi à vivre de manière autonome ?",o:["26,3 ans et 34 % émancipés","28,1 ans et 23 % émancipés","30,2 ans et seulement 14,5 % émancipés","33,0 ans et 8 % émancipés"],key:"30,2 ans · 14,5 %",
  r:"L'Observatoire de l'émancipation 2025 du Conseil de la jeunesse d'Espagne (publié en mai 2026) a atteint un minimum historique : seuls 14,5 % des 16–29 ans sont émancipés, avec un âge moyen de 30,2 ans (près de 4 ans au-dessus de la moyenne de l'UE de 26,3 ans selon Eurostat en septembre 2026, contre 21,3 ans en Finlande). Le loyer moyen (1 176 €/mois) équivaut à 98,7 % du salaire moyen des jeunes, faisant passer le risque de pauvreté des jeunes locataires de 25,9 % avant le paiement du logement à 43 % après.",
  s:"Conseil de la jeunesse d'Espagne, Observatoire de l'émancipation (mai 2026) et Eurostat (sept. 2026)",e:"À quel âge aimeriez-vous devenir autonomes ? De quoi auriez-vous besoin pour y parvenir ?"},
 {tag:"Le logement, moteur de pauvreté",q:"Le logement et ses charges absorbent un tiers (33,2 %) du budget du foyer moyen espagnol. Parmi les 20 % de foyers qui dépensent le moins (quintile 1), quel pourcentage du budget total va au seul logement/charges et à l'alimentation ?",o:["38,0 %","48,5 %","61,5 %","79,0 %"],key:"61,5 %",
  r:"L'Enquête sur les budgets des ménages 2025 de l'INE (juin 2026) montre que tandis que le foyer moyen consacre 33,2 % au logement/charges et 16,0 % à l'alimentation (49,2 % au total), les 20 % de foyers qui dépensent le moins consacrent 61,5 % de tout leur budget au seul logement et à l'énergie (41,9 %) plus l'alimentation (19,6 %). Le IXe rapport FOESSA (2025) indique également que 45 % des locataires sont en risque de pauvreté.",
  s:"INE (Enquête budgets des ménages 2025, juin 2026) et FOESSA (2025)",e:"Si près des deux tiers de l'argent partent dans le logement et la nourriture, que reste-t-il pour le reste ? À quoi renonceriez-vous en premier ?"},
 {tag:"Sans-abrisme et exclusion sévère",q:"Entre 2022 et 2024, de combien a augmenté la moyenne quotidienne de personnes sans abri hébergées dans des centres d'accueil en Espagne selon l'INE ?",o:["Elle a baissé de 5,2 %","Elle a augmenté de 12,0 %","Elle a augmenté de 57,5 % (jusqu'à 34 145 personnes par jour)","Elle a augmenté de 120 %"],key:"+57,5 % · 34 145 personnes/jour",
  r:"L'Enquête de l'INE sur les centres et services d'accueil des personnes sans abri (données 2024, publiée en septembre 2025) a enregistré une hausse de 57,5 % par rapport à 2022, jusqu'à une moyenne quotidienne de 34 145 adultes hébergés dans des centres d'accueil. Dans l'ensemble de la société, le IXe rapport FOESSA (2025) estime que l'exclusion sociale sévère touche désormais 4,3 millions de personnes en Espagne, 52 % de plus qu'en 2007.",
  s:"INE (Enquête sans-abri 2024, sept. 2025) et FOESSA (2025)",e:"Quand vous passez à côté d'une personne sans abri, de quoi pensez-vous qu'elle aurait besoin en plus de nourriture ?"},
 {tag:"Origine, racisme et sous-déclaration",q:"Le taux AROPE des personnes de nationalité espagnole est de 20,5 %. Jusqu'où monte-t-il chez les étrangers hors UE, et quel pourcentage des crimes de haine en Espagne n'est PAS signalé ?",o:["28 % AROPE et 40 % non signalés","39 % AROPE et 65 % non signalés","53,5 % AROPE et 90 % non signalés","72 % AROPE et 99 % non signalés"],key:"53,5 % · 90 %",
  r:"Selon l'enquête 2025 de l'INE, le taux AROPE est de 20,5 % pour la population espagnole, 36,4 % pour les étrangers de l'UE et 53,5 % pour les étrangers du reste du monde (2,6 fois plus). Cependant, FOESSA rappelle que 69 % de toutes les personnes en exclusion sont espagnoles. En outre, les délits et incidents de haine ont augmenté de 23,63 % en 2025 pour atteindre 2 417 faits (38,64 % pour racisme/xénophobie, tandis que 7 enfants roms sur 10 subissent une exclusion sévère selon FSG/FOESSA), et l'étude de l'ONDOD et de l'OBERAXE (2026) conclut que 90 % des crimes de haine ne sont pas signalés.",
  s:"INE (Enquête conditions de vie 2025), ONDOD/OBERAXE (2025–2026) et FSG/FOESSA",e:"Pourquoi pensez-vous que 9 victimes de haine sur 10 ne portent pas plainte ? Que faudrait-il pour qu'elles se sentent en sécurité ?"},
 {tag:"Inégalités éducatives et héritage intergénérationnel",q:"Le décrochage scolaire précoce en Espagne est tombé à 12,8 % en 2025 (contre 9,4 % dans l'UE en 2024), mais quel écart sépare la région au plus faible décrochage de celle au plus élevé, et par combien le fait de ne pas obtenir le diplôme de fin de secondaire obligatoire (ESO) multiplie-t-il le risque d'exclusion sévère ?",o:["De 8 % à 15 %, risque multiplié par 1,3","De 3,8 % (Pays basque) à 20,6 % (Région de Murcie), risque multiplié par 2,7","De 1 % à 11 %, risque multiplié par 1,8","De 10 % à 35 %, risque multiplié par 5,0"],key:"3,8 %–20,6 % · ×2,7",
  r:"Funcas (données 2025) situe le décrochage précoce à 12,8 % au niveau national (15,9 % chez les garçons contre 9,5 % chez les filles), tandis que les données régionales publiées selon la méthodologie Eurostat-INE montrent des écarts allant de 3,8 % au Pays basque à 20,6 % dans la Région de Murcie. Le IXe rapport FOESSA (2025) conclut que les enfants de parents peu diplômés ont plus de deux fois plus de risques de tomber dans la pauvreté et que ne pas obtenir l'ESO multiplie par 2,7 le risque d'exclusion sévère. S'y ajoute une dépense moyenne de rentrée de 2 484 € par enfant et par an selon l'OCU (août 2026).",
  s:"Funcas (2025), Eurostat-INE, IXe rapport FOESSA (2025) et OCU (août 2026)",e:"Quelle aide (à la maison, à l'école, entre camarades) permet à quelqu'un de ne pas abandonner ses études ?"},
 {tag:"Santé bucco-dentaire et santé mentale",q:"Quel pourcentage de la population espagnole déclare des besoins dentaires non satisfaits (près du triple des 4,6 % de l'UE selon Eurostat 2024), principalement parce que c'est trop cher ?",o:["4,8 %","8,2 %","12,0 %","25,5 %"],key:"12 %",
  r:"Selon les données d'Eurostat et des analyses sectorielles de 2025–2026, 12 % de la population en Espagne a des besoins bucco-dentaires non satisfaits (contre 4,6 % dans l'UE), en raison d'une couverture publique limitée et de prix médians privés, selon une enquête OCU de 2024, de 110 € pour un plombage, 250 € pour une dévitalisation et 1 850 € pour un implant. En santé mentale, la presse nationale de 2021–2023 faisait état de 6 psychologues cliniciens publics pour 100 000 habitants contre une moyenne européenne de 18.",
  s:"Eurostat (2024), OCU (2024) et presse nationale (2021–2023)",e:"Imaginez avoir mal aux dents pendant des semaines faute d'argent pour le dentiste. Comment cela affecterait-il votre quotidien ?"},
 {tag:"Fracture numérique et intelligence artificielle",q:"Bien que 96,3 % des 16–74 ans aient utilisé internet en 2025, quel écart sépare les niveaux d'études les plus bas des diplômés universitaires dans l'usage de l'IA générative, et combien d'adolescents aux revenus les plus faibles manquent d'un équipement numérique pour étudier ?",o:["12 points d'écart en IA et 1 adolescent sur 50","25 points en IA et 1 adolescent sur 25","Plus de 50 points en IA et 1 adolescent vulnérable sur 10","85 points en IA et la moitié des adolescents"],key:">50 points · 1 sur 10",
  r:"Le rapport de l'UGT sur la fracture numérique et l'IA, fondé sur l'enquête TIC 2025 de l'INE, identifie plus de 50 points de pourcentage d'écart dans l'usage de l'IA générative entre les niveaux d'études les plus bas et les diplômés universitaires (et 70 points entre les 16–24 ans et les 65–74 ans). En outre, 6,2 % des foyers espagnols n'ont toujours pas de connexion internet et la Plataforma de Infancia (février 2025) alerte sur le fait qu'1 adolescent de 15 ans sur 10 du quartile socio-économique le plus bas ne dispose pas d'un équipement numérique adapté pour se former chez lui.",
  s:"UGT sur l'enquête TIC 2025 de l'INE et Plataforma de Infancia (fév. 2025)",e:"Comment feriez-vous les devoirs de cette semaine sans ordinateur ni bonne connexion à la maison ?"},
 {tag:"Violence numérique et contrôle de genre chez les jeunes",q:"Selon le Baromètre Jeunesse et Genre 2025 (Fad Juventud et Délégation du gouvernement contre la violence de genre), quel pourcentage de jeunes femmes déclarent que leur partenaire a fouillé leur téléphone ?",o:["7,5 %","14,2 %","27,3 %","49,0 %"],key:"27,3 %",
  r:"Dans le Baromètre Jeunesse et Genre 2025 (enquête auprès de 3 327 jeunes de 15 à 29 ans), 27,3 % des jeunes femmes ont déclaré que leur partenaire avait fouillé leur téléphone, et une étude ultérieure de Fad Juventud (mai 2026) a relevé que 57 % des jeunes en Espagne ont subi une agression numérique en 2025. Ces dynamiques quotidiennes de contrôle numérique coexistent avec 106 549 cas actifs de violence sexiste enregistrés dans le système VioGén en 2026.",
  s:"Baromètre Jeunesse et Genre 2025 (Fad / DGVG), Fad Juventud (mai 2026) et VioGén (2026)",e:"Où est la limite entre s'intéresser à son partenaire et le contrôler ? Donnez des exemples concrets."}
]
